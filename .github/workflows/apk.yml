name: Gerar APK do Batuque

on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Preparar ficheiros da app (www)
        run: |
          mkdir -p www
          for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon.svg; do
            [ -f "$f" ] && cp "$f" www/ || echo "aviso: $f não existe"
          done

      - name: Instalar Capacitor e criar projeto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Permissões, ecrã e ícone
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <application#' $M
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:launchMode="singleTask"#' $M
          if [ -f icon-512.png ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=android/app/src/main/res/mipmap-${d%%:*}; px=${d##*:}
              for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert icon-512.png -resize ${px}x${px} $dir/$n.png
              done
            done
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          fi

      - name: Assinar e compilar o APK
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/batuque.keystore
            SP="${{ secrets.KEYSTORE_PASSWORD }}"
          else
            echo "AVISO: sem chave guardada, a usar chave temporária (não serve para atualizar a app)"
            SP="temporaria123"
            keytool -genkeypair -keystore android/app/batuque.keystore -alias batuque -keyalg RSA -keysize 2048 -validity 10000 -storepass $SP -keypass $SP -dname "CN=Batuque"
          fi
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file("batuque.keystore")
                      storePassword "$SP"
                      keyAlias "batuque"
                      keyPassword "$SP"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Batuque-APK
          path: android/app/build/outputs/apk/release/*.apk
