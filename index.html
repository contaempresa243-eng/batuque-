<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Batuque</title>
<style>
:root{--bg:#0d0d0d;--card:#181818;--card2:#222;--tx:#f4f4f4;--mut:#9a9a9a;--red:#ce1126;--yel:#ffcb05;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;display:block}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:auto;position:relative}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:24px;letter-spacing:-.5px}
h1 b{color:var(--yel)}
.bar{height:3px;width:56px;border-radius:3px;background:linear-gradient(90deg,var(--red) 50%,var(--yel) 50%);margin:6px 0 10px}
.search{width:100%;background:var(--card);border:1px solid #2a2a2a;border-radius:999px;padding:11px 16px;color:var(--tx);font-size:15px;outline:none}
.search:focus{border-color:var(--yel)}
main{flex:1;overflow-y:auto;padding:4px 12px 16px}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.row:active{background:var(--card)}
.row.on .t{color:var(--yel)}
.cov{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 2px #0006}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{padding:8px;border-radius:50%;color:var(--mut)}
.ib.on{color:var(--red)}
.ib:active{background:var(--card2)}
.empty{text-align:center;color:var(--mut);padding:60px 24px;line-height:1.6}
.empty svg{width:56px;height:56px;margin:0 auto 12px;opacity:.4}
.btn{background:var(--red);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;margin-top:16px}
.btn.alt{background:var(--card2);color:var(--tx)}
.head2{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.head2 h2{flex:1;font-size:19px}
.lcard{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:var(--r);margin-bottom:8px}
.lcard .cov{background:linear-gradient(135deg,var(--red),#7a0a17)}
#mini{display:none;align-items:center;gap:10px;margin:0 8px 6px;padding:8px 10px;background:var(--card2);border-radius:var(--r);position:relative;overflow:hidden}
#mini.show{display:flex}
#mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--yel);width:0}
nav{display:flex;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--yel)}
#fab{position:absolute;right:18px;bottom:calc(150px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 18px #000a;color:#fff;z-index:5}
#fab.up{bottom:calc(84px + env(safe-area-inset-bottom))}
#full{position:fixed;inset:0;background:linear-gradient(180deg,#2a0b10,#0d0d0d 60%);z-index:20;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
#full.show{display:flex}
#bigcov{width:min(78vw,340px);aspect-ratio:1;border-radius:20px;margin:auto;display:grid;place-items:center;font-size:96px;font-weight:800;color:#fff;box-shadow:0 20px 50px #000a;text-shadow:0 3px 8px #0006}
.ft{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{color:var(--mut);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:#333;outline:none;margin:16px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--yel)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--yel)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl .ib{color:var(--tx)}
.ctl .ib.act{color:var(--yel)}
.ctl svg{width:30px;height:30px}
.pp{background:var(--yel);color:#111!important;border-radius:50%!important;padding:16px!important}
.pp svg{width:34px;height:34px}
#sheet{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 8px calc(16px + env(safe-area-inset-bottom));max-height:70dvh;overflow:auto}
#sheet h3{padding:4px 14px 10px;font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet button{display:block;width:100%;text-align:left;padding:14px;font-size:16px;border-radius:10px}
#sheet button:active{background:var(--card2)}
#sheet button.danger{color:#ff5a6a}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><h1>Batu<b>que</b></h1></div>
    <div class="bar"></div>
    <input id="q" class="search" type="search" placeholder="Pesquisar músicas ou artistas…">
  </header>
  <main id="main"></main>
  <button id="fab" aria-label="Adicionar músicas"></button>
  <div id="mini"><div class="prog" id="mprog"></div></div>
  <nav>
    <button data-v="lib"></button>
    <button data-v="fav"></button>
    <button data-v="lists"></button>
  </nav>
</div>

<div id="full">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <button class="ib" id="fclose" style="color:var(--tx)"></button>
    <span style="color:var(--mut);font-size:13px" id="fctx">A tocar</span>
    <button class="ib" id="fmore" style="color:var(--tx)"></button>
  </div>
  <div id="bigcov"></div>
  <div style="display:flex;align-items:center;gap:8px">
    <div style="flex:1;min-width:0"><div class="ft" id="ft"></div><div class="fa" id="fa"></div></div>
    <button class="ib" id="ffav"></button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="bshuf"></button>
    <button class="ib" id="bprev"></button>
    <button class="ib pp" id="bplay"></button>
    <button class="ib" id="bnext"></button>
    <button class="ib" id="brep"></button>
  </div>
</div>

<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script>
'use strict';
const $=s=>document.querySelector(s);
const IC={
play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zm8 0h4v14h-4z',
next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',prev:'M6 6h2v12H6zm3.5 6l8.5 6V6z',
heart:'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
heartO:'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z',
shuf:'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z',
rep:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',
rep1:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z',
more:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
music:'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z',
list:'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',
down:'M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z',
back:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z'
};
const ic=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}><path d="${IC[n]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Armazenamento (IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{
  const r=indexedDB.open('batuque',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('lists',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const tx=(st,mode,fn)=>DB.then(d=>new Promise((res,rej)=>{
  const t=d.transaction(st,mode),s=t.objectStore(st),r=fn(s);
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);
}));

/* ---------- Estado ---------- */
let tracks=[],lists=[],view={t:'lib'},search='';
let queue=[],qi=-1,shuffle=false,repeat=0,curUrl=null,ctxName='A tocar';
const audio=$('#audio');
const byId=id=>tracks.find(t=>t.id===id);
const cur=()=>byId(queue[qi]);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;};
const cover=t=>`background:linear-gradient(135deg,hsl(${hue(t.title)} 65% 42%),hsl(${(hue(t.title)+50)%360} 70% 28%))`;
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let toastT;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1800);};

async function load(){
  tracks=await tx('tracks','readonly',s=>s.getAll());
  lists=await tx('lists','readonly',s=>s.getAll());
  tracks.sort((a,b)=>b.added-a.added);
  render();
}

/* ---------- Importar ---------- */
$('#file').onchange=async e=>{
  const files=[...e.target.files];let n=0;
  for(const f of files){
    let name=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
    let artist='Artista desconhecido',title=name;
    const i=name.indexOf(' - ');
    if(i>0){artist=name.slice(0,i).trim();title=name.slice(i+3).trim();}
    const t={id:crypto.randomUUID(),title,artist,blob:f,added:Date.now()+n,fav:false};
    await tx('tracks','readwrite',s=>s.put(t));n++;
  }
  e.target.value='';
  if(n){toast(n+(n>1?' músicas adicionadas':' música adicionada'));await load();}
};
const pickFiles=()=>$('#file').click();

/* ---------- Vistas ---------- */
function visible(){
  let arr;
  if(view.t==='fav')arr=tracks.filter(t=>t.fav);
  else if(view.t==='list'){const l=lists.find(x=>x.id===view.id);arr=(l?l.ids:[]).map(byId).filter(Boolean);}
  else arr=tracks;
  const q=search.toLowerCase();
  return q?arr.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q)):arr;
}
function rowHTML(t){
  const on=cur()&&cur().id===t.id;
  return `<div class="row${on?' on':''}" data-id="${t.id}">
    <div class="cov" style="${cover(t)}">${esc(t.title[0]||'♪').toUpperCase()}</div>
    <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>
    <button class="ib${t.fav?' on':''}" data-act="fav">${ic(t.fav?'heart':'heartO',22)}</button>
    <button class="ib" data-act="more">${ic('more',22)}</button></div>`;
}
function render(){
  const m=$('#main');let h='';
  document.querySelectorAll('nav button').forEach(b=>{
    const v=b.dataset.v;b.classList.toggle('on',v===view.t||(v==='lists'&&view.t==='list'));
  });
  $('#fab').style.display=(view.t==='lists')?'none':'grid';
  $('#fab').classList.toggle('up',!$('#mini').classList.contains('show'));
  if(view.t==='lists'){
    h+=`<div class="head2"><h2>As tuas listas</h2><button class="btn alt" id="newlist" style="margin:0;padding:9px 16px">+ Nova</button></div>`;
    if(!lists.length)h+=`<div class="empty">${ic('list')}Ainda não tens listas.<br>Cria uma para organizar as tuas músicas.</div>`;
    lists.forEach(l=>{
      h+=`<div class="lcard" data-list="${l.id}"><div class="cov">${ic('music',22)}</div>
      <div class="meta"><div class="t">${esc(l.name)}</div><div class="a">${l.ids.filter(byId).length} músicas</div></div></div>`;
    });
  }else{
    if(view.t==='list'){
      const l=lists.find(x=>x.id===view.id);
      h+=`<div class="head2"><button class="ib" id="lback">${ic('back')}</button><h2>${esc(l?l.name:'')}</h2>
      <button class="ib" id="lmore">${ic('more')}</button></div>`;
    }else if(view.t==='fav')h+=`<div class="head2"><h2>Favoritos</h2></div>`;
    const arr=visible();
    if(!arr.length){
      if(view.t==='lib'&&!tracks.length)h+=`<div class="empty">${ic('music')}A tua biblioteca está vazia.<br>Adiciona músicas do telemóvel para começar.<br><button class="btn" id="addbtn">Adicionar músicas</button></div>`;
      else h+=`<div class="empty">${ic(view.t==='fav'?'heart':'music')}${search?'Nada encontrado.':view.t==='fav'?'Toca no coração para guardar favoritos.':'Esta lista está vazia.'}</div>`;
    }else{
      if(view.t==='list'&&!search)h+=`<button class="btn" id="playall" style="margin:0 0 8px">▶ Tocar tudo</button>`;
      h+=arr.map(rowHTML).join('');
    }
  }
  m.innerHTML=h;
  const ab=$('#addbtn');if(ab)ab.onclick=pickFiles;
  const nl=$('#newlist');if(nl)nl.onclick=newList;
  const lb=$('#lback');if(lb)lb.onclick=()=>{view={t:'lists'};render();};
  const lm=$('#lmore');if(lm)lm.onclick=listMenu;
  const pa=$('#playall');if(pa)pa.onclick=()=>{const a=visible();if(a.length)play(a.map(t=>t.id),0,$('#main h2')?.textContent);};
  updateUI();
}
$('#main').addEventListener('click',e=>{
  const lc=e.target.closest('[data-list]');
  if(lc){view={t:'list',id:lc.dataset.list};search='';$('#q').value='';render();return;}
  const row=e.target.closest('.row');if(!row)return;
  const id=row.dataset.id,t=byId(id),act=e.target.closest('[data-act]')?.dataset.act;
  if(act==='fav'){toggleFav(t);return;}
  if(act==='more'){trackMenu(t);return;}
  const arr=visible().map(x=>x.id);
  play(arr,arr.indexOf(id),view.t==='fav'?'Favoritos':view.t==='list'?(lists.find(l=>l.id===view.id)||{}).name:'Biblioteca');
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view={t:b.dataset.v};search='';$('#q').value='';render();$('#main').scrollTop=0;});
$('#q').oninput=e=>{search=e.target.value.trim();render();};
$('#fab').onclick=pickFiles;

/* ---------- Menus ---------- */
function sheet(title,items){
  const b=$('#sbox');
  b.innerHTML=`<h3>${esc(title)}</h3>`+items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}">${esc(it.label)}</button>`).join('');
  b.onclick=e=>{const x=e.target.closest('button');if(!x)return;closeSheet();items[+x.dataset.i].fn();};
  $('#sheet').classList.add('show');
}
const closeSheet=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
function trackMenu(t){
  const it=[
    {label:'Tocar a seguir',fn:()=>{if(qi<0){play([t.id],0);}else{queue.splice(qi+1,0,t.id);toast('Vai tocar a seguir');}}},
    {label:'Adicionar a uma lista',fn:()=>pickList(t)}
  ];
  if(view.t==='list')it.push({label:'Remover desta lista',fn:async()=>{const l=lists.find(x=>x.id===view.id);l.ids=l.ids.filter(i=>i!==t.id);await tx('lists','readwrite',s=>s.put(l));render();}});
  it.push({label:'Renomear',fn:()=>renameTrack(t)});
  it.push({label:'Apagar da biblioteca',danger:true,fn:()=>delTrack(t)});
  sheet(t.title,it);
}
function pickList(t){
  const it=lists.map(l=>({label:l.name,fn:async()=>{if(!l.ids.includes(t.id)){l.ids.push(t.id);await tx('lists','readwrite',s=>s.put(l));}toast('Adicionada a "'+l.name+'"');render();}}));
  it.push({label:'+ Nova lista',fn:async()=>{const l=await newList();if(l){l.ids.push(t.id);await tx('lists','readwrite',s=>s.put(l));render();}}});
  sheet('Adicionar a…',it);
}
async function newList(){
  const name=(prompt('Nome da lista:')||'').trim();if(!name)return null;
  const l={id:crypto.randomUUID(),name,ids:[]};
  await tx('lists','readwrite',s=>s.put(l));lists.push(l);render();return l;
}
function listMenu(){
  const l=lists.find(x=>x.id===view.id);if(!l)return;
  sheet(l.name,[
    {label:'Renomear lista',fn:async()=>{const n=(prompt('Novo nome:',l.name)||'').trim();if(n){l.name=n;await tx('lists','readwrite',s=>s.put(l));render();}}},
    {label:'Apagar lista',danger:true,fn:async()=>{if(!confirm('Apagar a lista "'+l.name+'"?'))return;await tx('lists','readwrite',s=>s.delete(l.id));lists=lists.filter(x=>x.id!==l.id);view={t:'lists'};render();}}
  ]);
}
async function renameTrack(t){
  const title=(prompt('Título:',t.title)||'').trim();if(!title)return;
  const artist=(prompt('Artista:',t.artist)||'').trim()||t.artist;
  t.title=title;t.artist=artist;await tx('tracks','readwrite',s=>s.put(t));render();
}
async function delTrack(t){
  if(!confirm('Apagar "'+t.title+'"?'))return;
  const playing=cur()&&cur().id===t.id;
  await tx('tracks','readwrite',s=>s.delete(t.id));
  for(const l of lists){if(l.ids.includes(t.id)){l.ids=l.ids.filter(i=>i!==t.id);await tx('lists','readwrite',s=>s.put(l));}}
  const rest=queue.filter(i=>i!==t.id);
  if(playing){queue=rest;if(!queue.length){audio.pause();audio.removeAttribute('src');qi=-1;}else{qi=Math.min(qi,queue.length-1);}}
  else{const c=cur();queue=rest;qi=c?queue.indexOf(c.id):-1;}
  tracks=tracks.filter(x=>x.id!==t.id);
  if(playing&&qi>=0)loadCur();
  render();
}
async function toggleFav(t){t.fav=!t.fav;await tx('tracks','readwrite',s=>s.put(t));render();}

/* ---------- Leitor ---------- */
function play(ids,i,name){queue=ids.slice();qi=i;ctxName=name||'A tocar';loadCur();}
function loadCur(){
  const t=cur();if(!t)return;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(t.blob);
  audio.src=curUrl;
  audio.play().catch(()=>{});
  setSession(t);render();
}
function next(auto){
  if(!queue.length)return;
  if(auto&&repeat===2){audio.currentTime=0;audio.play();return;}
  if(shuffle&&queue.length>1){let n;do{n=Math.floor(Math.random()*queue.length);}while(n===qi);qi=n;}
  else if(qi+1<queue.length)qi++;
  else if(repeat===1||!auto)qi=0;
  else{audio.pause();audio.currentTime=0;updateUI();return;}
  loadCur();
}
function prev(){
  if(!queue.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return;}
  qi=qi>0?qi-1:queue.length-1;loadCur();
}
const toggle=()=>{if(qi<0)return;audio.paused?audio.play():audio.pause();};
audio.onended=()=>next(true);
audio.onplay=audio.onpause=()=>{updateUI();if('mediaSession'in navigator)navigator.mediaSession.playbackState=audio.paused?'paused':'playing';};
audio.ontimeupdate=()=>{
  const d=audio.duration||0,c=audio.currentTime;
  if(!seeking)$('#seek').value=d?c/d*1000:0;
  $('#tc').textContent=fmt(c);$('#td').textContent=fmt(d);
  $('#mprog').style.width=d?(c/d*100)+'%':'0';
  if('mediaSession'in navigator&&d&&isFinite(d)){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:1});}catch(e){}}
};
let seeking=false;
const sk=$('#seek');
sk.oninput=()=>{seeking=true;$('#tc').textContent=fmt(sk.value/1000*(audio.duration||0));};
sk.onchange=()=>{audio.currentTime=sk.value/1000*(audio.duration||0);seeking=false;};
function setSession(t){
  if(!('mediaSession'in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Batuque'});
  const h={play:()=>audio.play(),pause:()=>audio.pause(),previoustrack:prev,nexttrack:()=>next(false),
    seekto:e=>{audio.currentTime=e.seekTime;}};
  for(const k in h){try{navigator.mediaSession.setActionHandler(k,h[k]);}catch(e){}}
}

/* ---------- UI do leitor ---------- */
function updateUI(){
  const t=cur(),mini=$('#mini');
  mini.classList.toggle('show',!!t);
  $('#fab').classList.toggle('up',!t);
  if(t){
    mini.innerHTML=`<div class="cov" style="${cover(t)};width:42px;height:42px">${esc(t.title[0]||'♪').toUpperCase()}</div>
      <div class="meta" id="mopen"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>
      <button class="ib" id="mprev" style="color:var(--tx)">${ic('prev')}</button>
      <button class="ib" id="mplay" style="color:var(--tx)">${ic(audio.paused?'play':'pause',28)}</button>
      <button class="ib" id="mnext" style="color:var(--tx)">${ic('next')}</button>
      <div class="prog" id="mprog"></div>`;
    $('#mopen').onclick=openFull;mini.querySelector('.cov').onclick=openFull;
    $('#mplay').onclick=toggle;$('#mnext').onclick=()=>next(false);$('#mprev').onclick=prev;
    $('#ft').textContent=t.title;$('#fa').textContent=t.artist;
    $('#bigcov').style.cssText=cover(t);$('#bigcov').textContent=(t.title[0]||'♪').toUpperCase();
    $('#ffav').className='ib'+(t.fav?' on':'');$('#ffav').innerHTML=ic(t.fav?'heart':'heartO',28);
    $('#fctx').textContent=ctxName;
  }
  $('#bplay').innerHTML=ic(audio.paused?'play':'pause');
  $('#bshuf').className='ib'+(shuffle?' act':'');
  $('#brep').className='ib'+(repeat?' act':'');
  $('#brep').innerHTML=ic(repeat===2?'rep1':'rep');
}
function openFull(){$('#full').classList.add('show');}
$('#fclose').onclick=()=>$('#full').classList.remove('show');
$('#fmore').onclick=()=>{const t=cur();if(t)trackMenu(t);};
$('#ffav').onclick=()=>{const t=cur();if(t)toggleFav(t);};
$('#bplay').onclick=toggle;$('#bnext').onclick=()=>next(false);$('#bprev').onclick=prev;
$('#bshuf').onclick=()=>{shuffle=!shuffle;toast(shuffle?'Aleatório ligado':'Aleatório desligado');updateUI();};
$('#brep').onclick=()=>{repeat=(repeat+1)%3;toast(['Repetir desligado','Repetir tudo','Repetir uma'][repeat]);updateUI();};
$('#fclose').innerHTML=ic('down');$('#fmore').innerHTML=ic('more');
$('#bshuf').innerHTML=ic('shuf');$('#bprev').innerHTML=ic('prev');$('#bnext').innerHTML=ic('next');
$('#fab').innerHTML=ic('plus',28);
const NAV={lib:['music','Músicas'],fav:['heart','Favoritos'],lists:['list','Listas']};
document.querySelectorAll('nav button').forEach(b=>{const[i,l]=NAV[b.dataset.v];b.innerHTML=ic(i)+'<span>'+l+'</span>';});

/* ---------- PWA (manifest embutido) ---------- */
(function(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0d0d0d"/><rect y="440" width="256" height="24" fill="#ce1126"/><rect x="256" y="440" width="256" height="24" fill="#ffcb05"/><path fill="#ffcb05" d="M300 110v200a64 64 0 1 1-30-54V160h110v-50z"/></svg>`;
  const icon='data:image/svg+xml,'+encodeURIComponent(svg);
  const man={name:'Batuque',short_name:'Batuque',start_url:'.',display:'standalone',background_color:'#0d0d0d',theme_color:'#0d0d0d',
    icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  document.head.appendChild(l);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon;document.head.appendChild(a);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();

load();
</script>
