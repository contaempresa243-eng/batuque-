<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Batuque</title>
<style>
:root{color-scheme:dark;--bg:#0d0d0d;--card:#181818;--card2:#222;--tx:#f4f4f4;--mut:#9a9a9a;--bd:#2a2a2a;--track:#333;--mini:rgba(34,34,34,.97);--bgo:rgba(13,13,13,.68);--danger:#ff5a6a;--red:#ce1126;--yel:#ffcb05;--yel-d:#ffcb05;--onp:#111;--onp-d:#111;--tint:#2a0b10;--r:14px}
:root[data-theme=light]{color-scheme:light;--bg:#f4f4f6;--card:#ffffff;--card2:#e9e9ee;--tx:#17171a;--mut:#6b6b75;--bd:#dcdce2;--track:#cfcfd6;--mini:rgba(255,255,255,.97);--bgo:rgba(244,244,246,.76);--danger:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;display:block}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:auto;position:relative;z-index:1}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:24px;letter-spacing:-.5px}
h1 b{color:var(--yel)}
.bar{height:3px;width:56px;border-radius:3px;background:linear-gradient(90deg,var(--red) 50%,var(--yel) 50%);margin:6px 0 10px}
.search{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:11px 16px;color:var(--tx);font-size:15px;outline:none}
.search:focus{border-color:var(--yel)}
main{flex:1;overflow-y:auto;padding:4px 12px 90px}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-radius:12px}
.row:active{background:var(--card)}
.row.on .t{color:var(--yel)}
.n{min-width:22px;flex:none;text-align:center;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.row.on .n{color:var(--yel)}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:48px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.rt span:first-child{color:var(--tx);opacity:.85}
.row .ib{padding:6px}
.cov{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 2px #0006}
.cov{overflow:hidden}
#bigcov{overflow:hidden}
#viz{display:block;flex:none;width:100%;height:56px;margin:10px 0 4px;pointer-events:none}
.cov img,#bigcov img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{padding:8px;border-radius:50%;color:var(--mut)}
.ib.on{color:var(--red)}
.ib:active{background:var(--card2)}
.empty{text-align:center;color:var(--mut);padding:60px 24px;line-height:1.6}
.empty svg{width:56px;height:56px;margin:0 auto 12px;opacity:.4}
.empty .drums{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:26px}
.empty .drums svg{width:96px;height:auto;margin:0;opacity:1;filter:drop-shadow(0 8px 10px #0006)}
.empty .drums svg:first-child{transform:rotate(-6deg) translateX(6px)}
.empty .drums svg:last-child{transform:rotate(6deg) translateX(-6px)}
.btn{background:var(--red);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;margin-top:16px}
.btn.alt{background:var(--card2);color:var(--tx)}
.head2{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.head2 h2{flex:1;font-size:19px}
.lcard{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:var(--r);margin-bottom:8px}
.lcard .cov{background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 45%,#000))}
#mini{display:none;align-items:center;gap:6px;width:min(280px,calc(100vw - 16px));padding:6px 8px;background:var(--mini);border:1px solid var(--bd);border-radius:16px;position:fixed;left:8px;top:0;z-index:15;overflow:hidden;box-shadow:0 8px 24px #000a;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#mini.drag{cursor:grabbing;box-shadow:0 14px 34px #000c;transform:scale(1.03)}
#mini .cov{width:36px;height:36px;border-radius:8px;font-size:15px}
#mini .t{font-size:13px}
#mini .a{font-size:12px}
#mini .ib{padding:6px}
#mini .ib svg{width:22px;height:22px}
#mini #mplay svg{width:26px;height:26px}
#mini.show{display:flex}
#mini #marr{padding:4px;opacity:.75;flex:none;color:var(--tx)}
#mini #marr svg{width:18px;height:18px;transition:transform .2s}
#mini.mc{width:auto;gap:2px;padding:5px 6px}
#mini.mc .meta,#mini.mc #mprev,#mini.mc #mnext{display:none}
#mini.mc.sl{border-radius:0 16px 16px 0;border-left:0}
#mini.mc.sr{border-radius:16px 0 0 16px;border-right:0}
#mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--yel);width:0}
nav{display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--yel)}
#fab{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 18px #000a;color:#fff;z-index:5}
#fab.up{bottom:calc(76px + env(safe-area-inset-bottom))}
#full{position:fixed;inset:0;background:linear-gradient(180deg,var(--tint),#0d0d0d 60%);z-index:20;display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
#full.show{display:flex}
#full{overflow:hidden;color:var(--tx);--tx:#f4f4f4;--mut:#9a9a9a;--card:#181818;--card2:#222;--track:#333;--yel:var(--yel-d);--onp:var(--onp-d)}
#full>*{position:relative;z-index:1}
#full>#fbg,#full>#fshade{position:absolute;inset:0;z-index:0;pointer-events:none}
#fbg{background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(10px) saturate(1.1);transform:scale(1.12)}
#fshade{background:linear-gradient(180deg,rgba(13,13,13,.55) 0%,rgba(13,13,13,.35) 22%,rgba(13,13,13,.45) 55%,rgba(13,13,13,.88) 100%)}
.fhead{display:flex;align-items:center;gap:8px}
.ftx{flex:1;min-width:0;text-align:center}
#full .ft,#full .fa{text-shadow:0 1px 6px #000a}
#full .fa{color:#ddd}
.tools{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.tools .ib{color:var(--tx);padding:10px}
.tools svg{width:26px;height:26px}
#sheet .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
#sheet .chip{display:inline-block;width:auto;padding:8px 14px;border-radius:999px;background:var(--card2);font-size:14px}
#sheet .chip.on{background:var(--yel);color:var(--onp)}
.eqrow{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:10px;padding:2px 14px}
.eqrow span{font-size:13px;color:var(--mut)}
.eqrow output{font-size:13px;text-align:right}
.eqrow input[type=range]{margin:14px 0}
#bigcov{width:min(78vw,340px);aspect-ratio:1;margin:auto;display:grid;place-items:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 3px 8px #0006}
.ft{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{color:var(--mut);margin-top:2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--track);outline:none;margin:16px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--yel)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--yel)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl .ib{color:var(--tx)}
.ctl .ib.act{color:var(--yel)}
.ctl svg{width:30px;height:30px}
.pp{background:var(--yel);color:var(--onp)!important;border-radius:50%!important;padding:16px!important}
.pp svg{width:34px;height:34px}

#dlg{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:dlgf .16s ease-out}
#dlg .dbox{position:relative;width:100%;max-width:340px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:22px 20px 16px;box-shadow:0 18px 50px #000b;overflow:hidden;animation:dlgp .18s ease-out}
#dlg .dbox::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--red) 50%,var(--yel) 50%)}
#dlg .dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#dlg .dico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--yel)}
#dlg .dico svg{width:22px;height:22px}
#dlg.danger .dico{color:var(--danger)}
#dlg h2{font-size:18px;line-height:1.2;margin:0}
#dlg p{margin:0 0 14px;font-size:14.5px;line-height:1.45;color:var(--mut);white-space:pre-line;word-break:break-word}
#dlg input{display:block;width:100%;margin:0 0 14px;padding:12px 14px;background:var(--card2);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:16px;outline:none}
#dlg input:focus{border-color:var(--yel)}
#dlg .dbtn{display:flex;gap:10px;justify-content:flex-end}
#dlg .dbtn button{min-width:96px;padding:11px 18px;border-radius:12px;font-size:15px;font-weight:600;background:var(--card2);color:var(--tx)}
#dlg .dbtn button.ok{background:var(--yel);color:var(--onp)}
#dlg.danger .dbtn button.ok{background:var(--danger);color:#fff}
#dlg .dbtn button{outline:none}
#dlg .dbtn button:active{transform:scale(.97)}
@keyframes dlgf{from{opacity:0}to{opacity:1}}
@keyframes dlgp{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
#sheet{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:12px 8px calc(12px + env(safe-area-inset-bottom));max-height:52dvh;overflow:auto}
#sheet h3{padding:2px 14px 6px;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:15px;border-radius:10px}
#sheet button:active{background:var(--card2)}
#sheet button.danger{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#toast{max-width:88vw;text-align:center;line-height:1.35}
/* ===== Fundo, estilos do cartão e Definições ===== */
#bgimg{position:fixed;inset:0;z-index:0;display:none;background-size:cover;background-position:center}
#bgimg::after{content:'';position:absolute;inset:0;background:var(--bgo)}
.hasbg #bgimg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.bc{--k:1;position:relative;overflow:hidden;border-radius:calc(20px*var(--k));box-shadow:0 calc(20px*var(--k)) calc(50px*var(--k)) #000a}
[data-card=disc] .bc{border-radius:50%;animation:spin 24s linear infinite;animation-play-state:paused}
[data-card=disc] .bc::after{content:'';position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#0d0d0d;box-shadow:0 0 0 calc(3px*var(--k)) rgba(255,255,255,.4),inset 0 0 0 calc(2px*var(--k)) #000}
#full.playing[data-card=disc] #bigcov{animation-play-state:running}
[data-card=sharp] .bc{border-radius:0;box-shadow:0 calc(26px*var(--k)) calc(60px*var(--k)) #000c}
[data-card=polaroid] .bc{background:#f6f3ea!important;color:#555;text-shadow:none;padding:calc(14px*var(--k)) calc(14px*var(--k)) calc(54px*var(--k));border-radius:calc(5px*var(--k));transform:rotate(-2deg);box-shadow:0 calc(18px*var(--k)) calc(40px*var(--k)) #000b}
[data-card=polaroid] .bc img{border-radius:calc(2px*var(--k))}
[data-card=glass] .bc{background-clip:padding-box!important;border-radius:calc(30px*var(--k));border:calc(2px*var(--k)) solid rgba(255,255,255,.4);box-shadow:0 0 0 calc(9px*var(--k)) rgba(255,255,255,.1),0 calc(22px*var(--k)) calc(50px*var(--k)) #000a}
[data-card=glass] .bc::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,0) 42%);pointer-events:none}
[data-card=neon] .bc{border-radius:calc(18px*var(--k));border:calc(2px*var(--k)) solid var(--yel-d);box-shadow:0 0 calc(16px*var(--k)) var(--yel-d),0 0 calc(44px*var(--k)) color-mix(in srgb,var(--yel-d) 55%,transparent)}
@media (prefers-reduced-motion:reduce){[data-card=disc] .bc{animation:none}}
#settings{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:auto}
#settings.show{display:flex}
.shead{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--bd)}
.shead h2{flex:1;font-size:19px}
.shead .ib{color:var(--tx)}
#sset{flex:1;overflow-y:auto;padding:4px 14px calc(28px + env(safe-area-inset-bottom))}
.sgroup{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--yel);font-weight:700;margin:20px 4px 8px}
.srow{display:flex;align-items:center;flex-wrap:wrap;gap:12px;width:100%;padding:13px 12px;background:var(--card);border-radius:14px;margin-bottom:8px;text-align:left}
.srow .si{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--yel)}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-weight:600;font-size:15px}
.srow .st small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.srow>svg{color:var(--mut);flex:none}
button.srow:active{background:var(--card2)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--yel)}
.sw.on::after{left:21px}
.seg{display:flex;width:100%;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--yel);color:var(--onp);font-weight:700}
.pals,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pal,.cs{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px 10px;background:var(--card);border-radius:14px;border:2px solid transparent;font-size:12.5px;color:var(--mut)}
.pal.on,.cs.on{border-color:var(--yel);color:var(--tx)}
.pal.on::after,.cs.on::after{content:'✓';position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--yel);color:var(--onp);font-size:12px;line-height:18px;text-align:center;font-weight:700}
.pal .sx{width:44px;height:44px;border-radius:50%}
.cs{padding:16px 6px 10px}
.cs .bc{--k:.18;width:62px;aspect-ratio:1;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;flex:none}
.gal .gt{width:64px;height:64px;border-radius:12px;background:var(--card2) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mut)}
.gal .gb{display:flex;gap:8px;width:100%}
.gal .gb .btn{flex:1;margin:0;padding:11px;font-size:14px}
#sheet textarea{display:block;width:calc(100% - 28px);margin:6px 14px;min-height:110px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical;outline:none}
#sheet textarea:focus{border-color:var(--yel)}
#sheet .box.qbox{max-height:46dvh}
.st-sec{margin:20px 2px 8px;font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--yel);text-transform:uppercase}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-card{background:var(--card);border-radius:var(--r);padding:14px;min-width:0}
.st-card b{display:block;font-size:21px;letter-spacing:-.5px;white-space:nowrap}
.st-card small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--card);margin-bottom:6px}
.st-row:active{background:var(--card2)}
.st-n{width:18px;flex:none;font-weight:800;color:var(--yel);text-align:center}
.st-row .cov{width:42px;height:42px;font-size:16px;border-radius:9px}
.st-row .meta{min-width:0}
.st-bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.st-bar i{display:block;height:100%;border-radius:3px;background:var(--yel)}
.st-pct{flex:none;min-width:46px;text-align:right;font-weight:800;font-size:15px}
.st-pct small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.st-box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px}
.st-donut{display:flex;align-items:center;gap:14px}
.st-donut svg{width:128px;height:128px;flex:none}
.st-leg{flex:1;min-width:0;font-size:13px}
.st-leg div{display:flex;align-items:center;gap:8px;padding:3px 0}
.st-leg i{width:10px;height:10px;border-radius:50%;flex:none}
.st-leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-leg b{font-variant-numeric:tabular-nums}
.st-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.st-rings svg{width:92px;height:92px;display:block;margin:0 auto 6px}
.st-rings small{display:block;font-size:11.5px;color:var(--mut);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-rings b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-days{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.st-days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.st-days i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--yel);min-height:4px}
.st-days div.hoje{color:var(--tx);font-weight:700}
.prize{border-radius:22px;padding:18px 16px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--yel) 28%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--yel) 45%,transparent)}
.prize .tro svg{width:56px;height:56px;fill:var(--yel);filter:drop-shadow(0 4px 10px #0006)}
.prize h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--yel);margin:4px 0 2px}
.prize .gn{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.prize p{color:var(--mut);font-size:13px}
.podium{margin-top:14px;text-align:left}
.podium div{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--bd);font-size:14px}
.podium .md{font-size:20px;width:26px;flex:none;text-align:center}
.podium span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.podium b{font-variant-numeric:tabular-nums}
.st-hint{background:var(--card);border-radius:var(--r);padding:16px;color:var(--mut);font-size:14px;line-height:1.5;text-align:center}
.st-btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:999px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-weight:700;font-size:14px}
#selg{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
#selg:disabled{opacity:.4}
.fgl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.fcard .cov{width:100%;height:auto;aspect-ratio:16/10;border-radius:12px;background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 45%,#000))}
.fcard .meta{flex:none}
#vol{display:flex;align-items:center;gap:6px;margin:8px 0 0;touch-action:none;user-select:none;-webkit-user-select:none}
#vico{padding:6px;color:var(--tx)}#vico svg{width:22px;height:22px;fill:currentColor}
#vtrack{flex:1;height:36px;position:relative;touch-action:none;cursor:ew-resize}
#vtrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--track)}
#vfill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--yel);width:100%}
#vfill::after{content:'';position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--yel);box-shadow:0 1px 6px #0008}
#vpct{min-width:46px;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);transition:transform .12s,color .12s}
#vol.drag #vpct{color:var(--yel);transform:scale(1.25)}
.tact{display:flex;gap:2px;margin:-8px -6px -8px 0}
.tact .ib{color:var(--tx);padding:8px}
.tact .ib.on{color:var(--yel)}
#main .gl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;padding-top:2px}
.row.g{flex-direction:column;align-items:stretch;gap:6px;padding:6px;position:relative}
.row.g .cov{width:100%;height:auto;aspect-ratio:1;border-radius:12px;font-size:34px}
.row.g .meta{flex:none;text-align:left;padding:0 2px}
.row.g .t{font-size:13px}.row.g .a{font-size:12px}
.row.g .gm{position:absolute;top:10px;right:10px;background:transparent;filter:drop-shadow(0 0 2px #000c) drop-shadow(0 0 5px #0006);color:#fff;border-radius:50%;padding:3px;display:grid;place-items:center}
.row.g .gm svg{width:20px;height:20px}
.row.g .chk{position:absolute;top:12px;left:12px;background:#000a;border-color:#fff;z-index:1}
.row.g.sel .chk{background:var(--yel);border-color:var(--yel)}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{position:relative}
#selbar{display:none;position:absolute;left:0;right:0;bottom:8px;top:calc(14px + env(safe-area-inset-top));align-items:center;gap:6px;padding:0 10px 0 8px}
.selmode header>*:not(#selbar){visibility:hidden}
.selmode #selbar{display:flex}
.selmode #fab{display:none!important}
#selc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:700;color:var(--tx)}
#sela{padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
#seld{color:#fff;background:var(--red);border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
#seld svg{width:22px;height:22px;fill:currentColor}
#seld:disabled{opacity:.4}
.chk{min-width:22px;width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:transparent;margin:0 0 0 0}
.chk svg{width:15px;height:15px;fill:currentColor}
.row.sel{background:color-mix(in srgb,var(--yel) 14%,transparent)}
.row.sel .chk{background:var(--yel);border-color:var(--yel);color:#000}
#sheet .box.qbox button{padding:10px 14px;font-size:15px}
#sheet .btn{text-align:center;margin:10px 14px 0;width:calc(100% - 28px);border-radius:999px;font-weight:700;padding:13px}
</style>
</head>

<div id="bgimg"></div>

    <button class="ib pp" id="bplay"></button>
    <button class="ib" id="bnext"></button>
    <button class="ib" id="brep"></button>
  </div>
</div>

<div id="settings">

    <button class="ib" id="sback" aria-label="Voltar"></button>

  </div>
  <div id="sset"></div>
</div>

<div id="sheet"><div class="box" id="sbox"></div></div>

/* Imagem de fundo (galeria) */
const BG_KEY='batuque_bgimg';
const getBg=()=>{try{return localStorage.getItem(BG_KEY)||'';}catch(e){return'';}};
function applyBg(){const u=getBg();$('#bgimg').style.backgroundImage=u?`url("${u}")`:'';document.documentElement.classList.toggle('hasbg',!!u);}
const loadImg=file=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej();};im.src=u;});
async function setBgFromFile(file){
  try{
    const im=await loadImg(file);
    for(const max of [1280,900,600]){
      const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      try{localStorage.setItem(BG_KEY,c.toDataURL('image/jpeg',.8));applyBg();toast('Imagem de fundo definida');return true;}catch(e){}
    }
    toast('A imagem é demasiado grande');
  }catch(e){toast('Não foi possível abrir a imagem');}
  return false;
}

/* Modo ecrã cheio
   O navegador cancela o ecrã cheio sozinho (ecrã bloqueado, mudar de app, gesto de voltar,
   recarregar). Por isso guardamos a escolha (FS_KEY) e voltamos a entrar no próximo toque. */
const FS_KEY='batuque_fs';
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const fsWant=()=>{try{return localStorage.getItem(FS_KEY)==='1';}catch(e){return false;}};
const fsSet=v=>{try{if(v)localStorage.setItem(FS_KEY,'1');else localStorage.removeItem(FS_KEY);}catch(e){}};
const isApp=()=>{try{return matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const fsReq=()=>{if(isApp())return Promise.resolve();const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;return f?f.call(el):Promise.reject();};
async function toggleFS(){
  try{
    if(fsWant()||fsOn()){
      fsSet(false);
      if(fsOn())await (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){toast('O teu navegador não suporta o modo ecrã cheio');return;}
      await fsReq();fsSet(true);
    }
  }catch(e){toast('Não foi possível mudar o modo ecrã cheio');}
  if($('#settings').classList.contains('show')&&sv==='main')renderSettings();
}
/* volta a entrar em ecrã cheio no próximo toque, se o utilizador o tinha ligado */
function fsRestore(){
  /* o aviso do Chrome («Para sair do ecrã inteiro…») aparece sempre que uma página pede ecrã cheio;
     por isso a app instalada já abre em ecrã cheio sem pedir, e no navegador só entra quando o utilizador liga a opção */
  if(true)return;
  if(!fsWant()||fsOn())return;
  const go=()=>{
    if(!fsWant()||fsOn()){off();return;}
    fsReq().then(off).catch(()=>{});
  };
  const evs=['pointerup','touchend','click'];
  const off=()=>evs.forEach(e=>document.removeEventListener(e,go,true));
  evs.forEach(e=>document.addEventListener(e,go,true));
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!fsOn())fsRestore();
  if($('#settings').classList.contains('show')&&sv==='main')renderSettings();
}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fsRestore();});
window.addEventListener('pageshow',fsRestore);
fsRestore();

function dlg(o){
  return new Promise(res=>{
    const old=document.getElementById('dlg');if(old)old.remove();
    const d=document.createElement('div');d.id='dlg';if(o.danger)d.className='danger';
    d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
    const box=document.createElement('div');box.className='dbox';
    const head=document.createElement('div');head.className='dhead';
    const ico=document.createElement('div');ico.className='dico';ico.innerHTML=ic(o.icon||(o.danger?'trash':o.input?'music':'feedback'));
    const h=document.createElement('h2');h.textContent=o.title||'Batuque';
    head.append(ico,h);box.append(head);
    if(o.msg){const p=document.createElement('p');p.textContent=o.msg;box.append(p);}
    let inp=null;
    if(o.input){inp=document.createElement('input');inp.type='text';inp.value=o.value||'';inp.placeholder=o.placeholder||'';inp.autocomplete='off';inp.maxLength=120;box.append(inp);}
    const bt=document.createElement('div');bt.className='dbtn';
    const done=v=>{document.removeEventListener('keydown',key,true);d.remove();res(v);};
    if(o.cancel!==null){const c=document.createElement('button');c.textContent=o.cancel||'Cancelar';c.onclick=()=>done(inp?null:false);bt.append(c);}
    const k=document.createElement('button');k.className='ok';k.textContent=o.ok||'OK';
    k.onclick=()=>done(inp?inp.value.trim():true);bt.append(k);
    box.append(bt);d.append(box);
    const key=e=>{
      if(e.key==='Escape'){e.preventDefault();done(inp?null:(o.cancel===null?true:false));}
      else if(e.key==='Enter'&&e.target!==document.body&&inp){e.preventDefault();k.click();}
    };
    document.addEventListener('keydown',key,true);
    d.addEventListener('pointerdown',e=>{if(e.target===d)done(inp?null:(o.cancel===null?true:false));});
    document.body.append(d);
    setTimeout(()=>{if(inp){inp.focus();inp.select();}else k.focus();},30);
  });
}

/* Atualizar app */
async function checkUpdate(){
  if(!navigator.onLine){toast('Sem ligação à internet');return;}
  toast('A procurar atualizações…',2500);
  try{
    const r=await fetch(location.href.split('#')[0].split('?')[0],{cache:'reload'});
    if(!r.ok)throw new Error(r.status);
    const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/),nv=m&&m[1];
    if(nv&&nv!==APP_VERSION){
      if(await dlg({title:'Nova versão disponível',msg:'A versão '+nv+' está pronta (tens a '+APP_VERSION+').\nA música em reprodução vai parar durante a atualização.',ok:'Atualizar',cancel:'Agora não',icon:'refresh'})){
        if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
        if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()));}
        location.reload();
      }
    }else toast('Já tens a versão mais recente ('+APP_VERSION+')',3000);
  }catch(e){toast('Não foi possível verificar atualizações',3000);}
}

async function sendFeedback(type,msg){
  const subj='Batuque · '+type+' (v'+APP_VERSION+')',body=msg+'\n\n— Batuque v'+APP_VERSION+' · '+navigator.userAgent;
  if(FEEDBACK_EMAIL){location.href='mailto:'+FEEDBACK_EMAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);return true;}
  if(navigator.share){try{await navigator.share({title:subj,text:body});return true;}catch(e){if(e&&e.name==='AbortError')return false;}}
  try{await navigator.clipboard.writeText(subj+'\n\n'+body);toast('Texto copiado. Cola-o numa mensagem para o criador da app.',5000);return true;}catch(e){}
  toast('Não foi possível enviar o feedback neste navegador',3000);return false;
}

/* ---------- Capas ---------- */
const covCache=new Map();
function covURL(t){
  if(!t.cover)return null;
  let u=covCache.get(t.id);
  if(!u||u.b!==t.cover){
    if(u)URL.revokeObjectURL(u.url);
    u={b:t.cover,url:URL.createObjectURL(t.cover)};covCache.set(t.id,u);
  }
  return u.url;
}
function dropCov(id){const u=covCache.get(id);if(u){URL.revokeObjectURL(u.url);covCache.delete(id);}}
function covInner(t){
  const u=covURL(t);
  return u?`<img src="${u}" alt="" decoding="async">`:esc((t.title[0]||'♪').toUpperCase());
}
const u32=(d,o)=>((d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3])>>>0;
const ssafe=(d,o)=>((d[o]&127)<<21)|((d[o+1]&127)<<14)|((d[o+2]&127)<<7)|(d[o+3]&127);
const latin=(d,a,b)=>{let s='';for(let i=a;i<b;i++)s+=String.fromCharCode(d[i]);return s;};
function sniff(d){
  if(d[0]===0x89&&d[1]===0x50)return'image/png';
  if(d[0]===0x47&&d[1]===0x49)return'image/gif';
  if(d[0]===0x52&&d[1]===0x49)return'image/webp';
  return'image/jpeg';
}
const ID3V1=['Blues','Classic Rock','Country','Dance','Disco','Funk','Grunge','Hip Hop','Jazz','Metal','New Age','Oldies','Other','Pop','R&B','Rap','Reggae','Rock','Techno','Industrial','Alternative','Ska','Death Metal','Pranks','Soundtrack','Euro-Techno','Ambient','Trip-Hop','Vocal','Jazz+Funk','Fusion','Trance','Classical','Instrumental','Acid','House','Game','Sound Clip','Gospel','Noise','Alt. Rock','Bass','Soul','Punk','Space','Meditative','Instrumental Pop','Instrumental Rock','Ethnic','Gothic','Darkwave','Techno-Industrial','Electronic','Pop-Folk','Eurodance','Dream','Southern Rock','Comedy','Cult','Gangsta','Top 40','Christian Rap','Pop/Funk','Jungle','Native American','Cabaret','New Wave','Psychedelic','Rave','Showtunes','Trailer','Lo-Fi','Tribal','Acid Punk','Acid Jazz','Polka','Retro','Musical','Rock & Roll','Hard Rock'];
function normGenre(raw){
  let g=String(raw||'').trim();if(!g)return'';
  const m=g.match(/^\((\d{1,3})\)\s*(.*)$/);
  if(m)g=m[2]||ID3V1[+m[1]]||'';
  else if(/^\d{1,3}$/.test(g))g=ID3V1[+g]||'';
  g=g.split(/[;/,]/)[0].trim();
  const k=g.toLowerCase().replace(/[^a-z0-9&]/g,'');
  if(!k||['other','unknown','genre','none','misc','desconhecido','outro','outros'].includes(k))return'';
  const map={hiphop:'Hip Hop',rap:'Hip Hop',rnb:'R&B','r&b':'R&B',afrobeats:'Afrobeat',electronica:'Eletrónica',electronic:'Eletrónica',classical:'Clássica',classica:'Clássica'};
  if(map[k])return map[k];
  return g.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').slice(0,28);
}
const TXT={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TPE2:'albumArtist',TP2:'albumArtist',TCON:'genre',TCO:'genre'};
function decText(d,s,e){
  if(e<=s)return'';
  const enc=d[s];let a=s+1,label='windows-1252';
  if(enc===1){
    if(d[a]===0xFF&&d[a+1]===0xFE){label='utf-16le';a+=2;}
    else if(d[a]===0xFE&&d[a+1]===0xFF){label='utf-16be';a+=2;}
    else label='utf-16le';
  }else if(enc===2)label='utf-16be';
  else if(enc===3)label='utf-8';
  try{return new TextDecoder(label).decode(d.subarray(a,e)).split('\0').map(x=>x.trim()).filter(Boolean).join(', ');}
  catch(x){return'';}
}
function parseName(fn){
  const name=String(fn||'').replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const i=name.indexOf(' - ');
  return i>0?{artist:name.slice(0,i).trim(),title:name.slice(i+3).trim()}:{artist:'Artista desconhecido',title:name};
}
async function id3Tags(file,h){
  const out={title:'',artist:'',cover:null};let aa='';
  const ver=h[3],flags=h[5],size=ssafe(h,6);
  const total=Math.min(size+10,file.size,16*1024*1024);
  const d=new Uint8Array(await file.slice(0,total).arrayBuffer());
  let p=10;
  if(flags&0x40)p+=ver===4?ssafe(d,10):u32(d,10)+4;
  const idLen=ver===2?3:4,hdr=ver===2?6:10;
  while(p+hdr<=d.length){
    const id=latin(d,p,p+idLen);
    if(!/^[A-Z0-9]+$/.test(id))break;
    let fs;
    if(ver===2)fs=(d[p+3]<<16)|(d[p+4]<<8)|d[p+5];
    else if(ver===4)fs=ssafe(d,p+4);
    else fs=u32(d,p+4);
    if(!fs)break;
    const s=p+hdr,e=Math.min(s+fs,d.length),k=TXT[id];
    if(k){
      const v=decText(d,s,e).slice(0,200);
      if(k==='albumArtist'){if(!aa)aa=v;}else if(!out[k])out[k]=v;
    }else if((id==='APIC'||id==='PIC')&&!out.cover){
      for(let i=s+1;i<e-4;i++){
        const jpg=d[i]===0xFF&&d[i+1]===0xD8&&d[i+2]===0xFF;
        const png=d[i]===0x89&&d[i+1]===0x50&&d[i+2]===0x4E&&d[i+3]===0x47;
        if(jpg||png){out.cover=new Blob([d.slice(i,e)],{type:jpg?'image/jpeg':'image/png'});break;}
      }
    }
    p=e;
  }
  if(!out.artist)out.artist=aa;
  return out;
}
async function flacTags(file){
  const out={title:'',artist:'',cover:null};let aa='';
  const d=new Uint8Array(await file.slice(0,Math.min(file.size,16*1024*1024)).arrayBuffer());
  const le=o=>(d[o]|(d[o+1]<<8)|(d[o+2]<<16)|(d[o+3]<<24))>>>0;
  const dec=new TextDecoder();
  let p=4;
  while(p+4<=d.length){
    const last=d[p]&128,type=d[p]&127,len=(d[p+1]<<16)|(d[p+2]<<8)|d[p+3];
    if(type===4){
      let o=p+4;o+=4+le(o);
      const n=le(o);o+=4;
      for(let i=0;i<n&&o+4<=p+4+len;i++){
        const l=le(o);o+=4;
        const kv=dec.decode(d.subarray(o,o+l));o+=l;
        const q=kv.indexOf('=');if(q<1)continue;
        const key=kv.slice(0,q).toUpperCase(),val=kv.slice(q+1).trim().slice(0,200);
        if(key==='TITLE'&&!out.title)out.title=val;
        else if(key==='ARTIST'&&!out.artist)out.artist=val;
        else if(key==='ALBUMARTIST'&&!aa)aa=val;
        else if(key==='GENRE'&&!out.genre)out.genre=val;
      }
    }else if(type===6&&!out.cover){
      let o=p+8;o+=4+u32(d,o);o+=4+u32(d,o)+16;
      const n=u32(d,o);o+=4;
      const img=d.slice(o,o+n);
      out.cover=new Blob([img],{type:sniff(img)});
    }
    p+=4+len;if(last)break;
  }
  if(!out.artist)out.artist=aa;
  return out;
}
async function mp4Tags(file){
  const out={title:'',artist:'',cover:null};let aa='';
  const N=3*1024*1024,dec=new TextDecoder();
  const parts=[new Uint8Array(await file.slice(0,Math.min(N,file.size)).arrayBuffer())];
  if(file.size>N)parts.push(new Uint8Array(await file.slice(Math.max(N,file.size-N)).arrayBuffer()));
  for(const d of parts){
    for(let i=4;i<d.length-24;i++){
      const c=d[i];
      if(c!==0xA9&&c!==0x63&&c!==0x61&&c!==0x67)continue;
      if(latin(d,i+8,i+12)!=='data')continue;
      const nm=latin(d,i,i+4),s=i+20,e=Math.min(i+4+u32(d,i+4),d.length);
      const txt=()=>dec.decode(d.subarray(s,e)).trim().slice(0,200);
      if(nm==='covr'){if(!out.cover){const img=d.slice(s,e);out.cover=new Blob([img],{type:sniff(img)});}}
      else if(nm==='\xA9ART'){if(!out.artist)out.artist=txt();}
      else if(nm==='\xA9nam'){if(!out.title)out.title=txt();}
      else if(nm==='aART'){if(!aa)aa=txt();}
      else if(nm==='\xA9gen'){if(!out.genre)out.genre=txt();}
      else if(nm==='gnre'){if(!out.genre){const n=(d[s]<<8)|d[s+1];if(n>0&&n<=ID3V1.length)out.genre=ID3V1[n-1];}}
    }
    if(out.title&&out.artist&&out.cover)break;
  }
  if(!out.artist)out.artist=aa;
  return out;
}
async function readTags(file){
  let out={title:'',artist:'',cover:null};
  try{
    const h=new Uint8Array(await file.slice(0,12).arrayBuffer());
    const fl=latin(h,0,4)==='fLaC',mp=latin(h,4,8)==='ftyp';
    if(latin(h,0,3)==='ID3')out=await id3Tags(file,h);
    else if(fl)out=await flacTags(file);
    else if(mp)out=await mp4Tags(file);
    if(!fl&&!mp&&(!out.artist||!out.title||!out.genre)&&file.size>128){
      const d=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
      if(latin(d,0,3)==='TAG'){
        const f=(a,b)=>latin(d,a,b).split('\0')[0].trim();
        if(!out.title)out.title=f(3,33);
        if(!out.artist)out.artist=f(33,63);
        if(!out.genre&&d[127]<ID3V1.length)out.genre=ID3V1[d[127]];
      }
    }
  }catch(e){}
  out.genre=normGenre(out.genre);
  return out;
}
const readCover=async f=>(await readTags(f)).cover;
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
function getDur(blob){
  return new Promise(res=>{
    const a=new Audio(),u=URL.createObjectURL(blob);
    let done=false;
    const end=v=>{
      if(done)return;done=true;
      URL.revokeObjectURL(u);a.removeAttribute('src');a.load();
      res(isFinite(v)?Math.round(v):0);
    };
    a.preload='metadata';
    a.onloadedmetadata=()=>end(a.duration);
    a.onerror=()=>end(0);
    setTimeout(()=>end(0),8000);
    a.src=u;
  });
}
let bf=false;
async function backfill(){
  if(bf)return;bf=true;let ch=false,k=0;
  for(const t of tracks.slice()){
    const needTags=!(t.coverTried&&t.metaTried),needDur=t.dur===undefined,needG=!t.genreTried;
    if(!needTags&&!needDur&&!needG)continue;
    const tg=(needTags||needG)?await readTags(t.blob):null;
    const dur=needDur?await getDur(t.blob):0;
    const r=await tx('tracks','readonly',s=>s.get(t.id));
    if(!r){t.coverTried=t.metaTried=t.genreTried=true;t.dur=0;continue;}
    if(tg){
      if(!r.genreTried){r.genre=tg.genre||'';r.genreTried=true;if(r.genre)ch=true;}
      if(!r.coverTried){r.cover=tg.cover;r.coverTried=true;if(tg.cover)ch=true;}
      if(!r.metaTried){
        const nm=parseName(r.blob&&r.blob.name);
        if(tg.artist&&r.artist==='Artista desconhecido'){r.artist=tg.artist;ch=true;}
        if(tg.title&&nm.title&&r.title===nm.title){r.title=tg.title;ch=true;}
        r.metaTried=true;
      }
    }
    if(r.dur===undefined){r.dur=dur;if(dur)ch=true;}
    await tx('tracks','readwrite',s=>s.put(r));
    t.cover=r.cover;t.artist=r.artist;t.title=r.title;t.dur=r.dur;t.coverTried=true;t.metaTried=true;t.genre=r.genre;t.genreTried=r.genreTried;
    if(ch&&++k%6===0)render();
  }
  bf=false;
  if(ch){render();if(cur())setSession(cur());}
  if(tracks.some(x=>!(x.coverTried&&x.metaTried)||x.dur===undefined||!x.genreTried))backfill();
}

}

const isAudio=f=>(f.type||'').startsWith('audio/')||/\.(mp3|m4a|aac|flac|wav|ogg|oga|opus|wma|amr)$/i.test(f.name||'');
async function importFiles(list){
  let n=0,skip=0;const total=list.length,folders=new Set();
  for(const {f,folder} of list){
    if(folder&&tracks.some(x=>x.folder===folder&&x.fname===f.name&&x.blob.size===f.size)){skip++;continue;}
    try{
      const nm=parseName(f.name),tg=await readTags(f);
      const t={id:crypto.randomUUID(),title:tg.title||nm.title,artist:tg.artist||nm.artist,blob:f,added:Date.now()+n,fav:false,cover:tg.cover,coverTried:true,metaTried:true,genre:tg.genre||'',genreTried:true,folder:folder||'',fname:f.name};
      await tx('tracks','readwrite',s=>s.put(t));n++;if(folder)folders.add(folder);
    }catch(e){skip++;}
    if(total>6&&(n+skip)%4===0)toast('A importar… '+(n+skip)+'/'+total,1500);
  }
  if(n){
    toast(n+(n>1?' músicas adicionadas':' música adicionada')+(folders.size?' · '+folders.size+(folders.size>1?' pastas':' pasta'):'')+(skip?' · '+skip+' já existiam':''),3200);
    await load();
  }else toast(skip?'Essas músicas já estavam na biblioteca':'Nenhuma música encontrada',2800);
}

async function walkDir(h,name,out){
  for await(const [n,e] of h.entries()){
    if(e.kind==='file'){const f=await e.getFile();if(isAudio(f))out.push({f,folder:name});}
    else await walkDir(e,e.name,out);
  }
}
async function pickFolder(){

  let seen=false;try{seen=localStorage.getItem('batuque_dirhint')==='1';}catch(e){}
  if(!seen){
    const ok=await dlg({title:'Adicionar uma pasta',msg:'Escolhe a pasta onde tens as músicas.\nA seguir, o Chrome vai perguntar se o Batuque pode ver os ficheiros dessa pasta: toca em «Permitir».\nAs músicas são copiadas para dentro da app e ficam disponíveis sem internet.',ok:'Escolher pasta',cancel:'Cancelar',icon:'folder'});
    if(!ok)return;
    try{localStorage.setItem('batuque_dirhint','1');}catch(e){}
  }
  if(window.showDirectoryPicker){
    try{
      const dir=await window.showDirectoryPicker({mode:'read'}),out=[];

$('#dirfile').onchange=async e=>{

  const hasPath=files.some(f=>(f.webkitRelativePath||'').includes('/'));
  let fb='';
  if(!hasPath){
    /* alguns navegadores móveis não indicam a pasta: pede o nome */
    fb=(await askText('Nome da pasta','Dá um nome ao grupo das '+files.length+' músicas escolhidas.','Minhas músicas','Nome da pasta','Adicionar')||'').trim();

  }
  await importFiles(files.map(f=>{

  }));
};

function selUI(){

  if(!sel)return;

  $('#selc').textContent=n?n+(n>1?' selecionadas':' selecionada'):'Selecionar músicas';
  $('#seld').disabled=!n;$('#selg').disabled=!n;
  const vis=visible();$('#sela').textContent=vis.length&&vis.every(t=>sel.has(t.id))?'Nenhuma':'Todas';

function startSel(id){sel=new Set(id?[id]:[]);render();selUI();if(navigator.vibrate)try{navigator.vibrate(15);}catch(e){}}
function endSel(quiet){if(!sel)return;sel=null;selUI();if(!quiet)render();}
function toggleSel(id){
  if(sel.has(id))sel.delete(id);else sel.add(id);
  const r=document.querySelector(`#main .row[data-id="${CSS.escape(id)}"]`);

function selAll(){

/* toque longo numa música começa a seleção */
(()=>{
  const m=$('#main');let tm=null,x0=0,y0=0;
  const stop=()=>{clearTimeout(tm);tm=null;};
  m.addEventListener('pointerdown',e=>{
    lpFired=false;
    const row=e.target.closest('.row');if(!row||sel||e.target.closest('[data-act]'))return;
    x0=e.clientX;y0=e.clientY;const id=row.dataset.id;

  ['pointerup','pointercancel','pointerleave'].forEach(n=>m.addEventListener(n,stop));
  m.addEventListener('scroll',stop,{passive:true});

})();

async function renameTrack(t){
  const title=(await askText('Renomear música','Título da música',t.title,'Título')||'').trim();if(!title)return;
  const artist=(await askText('Renomear música','Artista',t.artist,'Artista')||'').trim()||t.artist;
  t.title=title;t.artist=artist;await tx('tracks','readwrite',s=>s.put(t));render();
}
async function delTracks(ids){
  const set=new Set(ids),c=cur(),playing=!!c&&set.has(c.id);
  await tx('tracks','readwrite',s=>{ids.forEach(id=>s.delete(id));});
  for(const l of lists){if(l.ids.some(i=>set.has(i))){l.ids=l.ids.filter(i=>!set.has(i));await tx('lists','readwrite',s=>s.put(l));}}
  const keep=playing?null:c;
  const oldQi=qi;
  const rest=queue.filter(i=>!set.has(i));
  if(playing){
    /* continua na primeira música que sobrou depois da atual */
    let n=-1;for(let k=oldQi+1;k<queue.length;k++){if(!set.has(queue[k])){n=rest.indexOf(queue[k]);break;}}
    queue=rest;
    if(!queue.length){audio.pause();audio.removeAttribute('src');qi=-1;}else qi=n>=0?n:0;
  }else{queue=rest;qi=keep?queue.indexOf(keep.id):-1;}
  ids.forEach(dropCov);
  tracks=tracks.filter(x=>!set.has(x.id));
  sel=null;selUI();
  if(playing&&qi>=0)loadCur();
  render();
}
async function delTrack(t){
  if(!await askOk('Apagar música','Apagar "'+t.title+'" da biblioteca?\nEsta ação não pode ser desfeita.','Apagar',true))return;
  const playing=cur()&&cur().id===t.id;
  await tx('tracks','readwrite',s=>s.delete(t.id));
  for(const l of lists){if(l.ids.includes(t.id)){l.ids=l.ids.filter(i=>i!==t.id);await tx('lists','readwrite',s=>s.put(l));}}
  const rest=queue.filter(i=>i!==t.id);
  if(playing){queue=rest;if(!queue.length){audio.pause();audio.removeAttribute('src');qi=-1;}else{qi=Math.min(qi,queue.length-1);}}
  else{const c=cur();queue=rest;qi=c?queue.indexOf(c.id):-1;}
  dropCov(t.id);
  tracks=tracks.filter(x=>x.id!==t.id);
  if(playing&&qi>=0)loadCur();
  render();
}
async function toggleFav(t){t.fav=!t.fav;await tx('tracks','readwrite',s=>s.put(t));render();}

/* ---------- Leitor ---------- */
function play(ids,i,name,ctx){queue=ids.slice();qi=i;ctxName=name||'A tocar';qctx=ctx||null;loadCur();}
function syncQueue(){
  if(!qctx||qctx.k!=='lib'||qctx.f)return;
  const c=cur();if(!c)return;
  const ids=ordered(tracks).map(t=>t.id),i=ids.indexOf(c.id);
  if(i<0)return;
  queue=ids;qi=i;
}
function loadCur(){
  const t=cur();if(!t)return;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(t.blob);
  if(eqG.some(g=>g)&&!actx)initEQ();
  if(actx&&actx.state==='suspended')actx.resume();
  audio.src=curUrl;
  audio.play().catch(()=>{});
  setSession(t);render();saveResume(true);
}
function next(auto){
  if(!queue.length)return;
  if(auto&&repeat===2){audio.currentTime=0;audio.play();return;}
  if(shuffle&&queue.length>1){let n;do{n=Math.floor(Math.random()*queue.length);}while(n===qi);qi=n;}
  else if(qi+1<queue.length)qi++;
  else if(repeat===1||!auto)qi=0;
  else{audio.pause();audio.currentTime=0;updateUI();return;}
  loadCur();
}
function prev(force){
  if(!queue.length)return;
  if(!force&&audio.currentTime>3){audio.currentTime=0;return;}
  qi=qi>0?qi-1:queue.length-1;loadCur();
}
const toggle=()=>{if(qi<0)return;audio.paused?audio.play():audio.pause();};
audio.onended=()=>{if(sleepMode==='track'){sleepClear();audio.pause();updateUI();toast('Temporizador: música terminada',3000);return;}next(true);};
audio.onplay=audio.onpause=()=>{updateUI();if('mediaSession'in navigator)navigator.mediaSession.playbackState=audio.paused?'paused':'playing';};
audio.ontimeupdate=()=>{
  const d=audio.duration||0,c=audio.currentTime;
  if(!seeking)$('#seek').value=d?c/d*1000:0;
  $('#tc').textContent=fmt(c);$('#td').textContent=fmt(d);
  $('#mprog').style.width=d?(c/d*100)+'%':'0';
  syncPos();saveResume();
};
let posT=0;
function syncPos(force){
  if(!('mediaSession'in navigator)||!navigator.mediaSession.setPositionState)return;
  const now=Date.now();
  if(force!==true&&now-posT<1000)return;
  const d=audio.duration;
  if(!d||!isFinite(d))return;
  posT=now;
  try{navigator.mediaSession.setPositionState({duration:d,position:Math.max(0,Math.min(audio.currentTime||0,d)),playbackRate:audio.playbackRate||1});}catch(e){}
}
['loadedmetadata','durationchange','play','pause','seeked','ratechange','playing'].forEach(n=>audio.addEventListener(n,()=>syncPos(true)));
let seeking=false;
const sk=$('#seek');
sk.oninput=()=>{seeking=true;$('#tc').textContent=fmt(sk.value/1000*(audio.duration||0));};
sk.onchange=()=>{audio.currentTime=sk.value/1000*(audio.duration||0);seeking=false;};
/* ---------- Notificação / ecrã bloqueado (Media Session) ---------- */
let artKey='',artUrl='',sesTok=0;
const loadSvgImg=svg=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
/* imagem QUADRADA 512×512 com as cores do tema escolhido na app.
   O Android tira a cor do cartão da notificação a partir desta imagem. */
async function makeArt(t){
  const P=PALS.find(p=>p.id===CFG.pal)||PALS[0],light=effMode()==='light',S=512;
  const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,S,S);
  if(light){g.addColorStop(0,P.p);g.addColorStop(1,P.pl);}else{g.addColorStop(0,P.t);g.addColorStop(1,P.a);}
  x.fillStyle=g;x.fillRect(0,0,S,S);
  let drew=false;
  if(t.cover){
    try{
      const im=await loadImg(t.cover),w=im.naturalWidth,h=im.naturalHeight,m=Math.min(w,h);
      x.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,S,S);   /* capa quadrada, sem moldura */
      drew=true;
    }catch(e){}
  }
  if(!drew){
    try{
      const d1=await loadSvgImg(drumSVG(1,'xmlns="http://www.w3.org/2000/svg" width="200" height="264"'));
      const d2=await loadSvgImg(drumSVG(2,'xmlns="http://www.w3.org/2000/svg" width="200" height="264"'));
      x.drawImage(d1,48,92,200,264);x.drawImage(d2,264,92,200,264);
    }catch(e){}
  }
  /* sem faixas nem molduras: alguns telemóveis cortam a capa em círculo e a faixa ficaria como um arco */
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}
async function artFor(t){
  const key=t.id+'|'+CFG.pal+'|'+effMode()+'|'+(t.cover?t.cover.size:0);
  if(key===artKey&&artUrl)return artUrl;
  const b=await makeArt(t);if(!b)return null;
  const old=artUrl;artUrl=URL.createObjectURL(b);artKey=key;
  if(old)setTimeout(()=>URL.revokeObjectURL(old),8000);
  return artUrl;
}
function msHandlers(){
  if(!('mediaSession'in navigator))return;
  const h={play:()=>audio.play(),pause:()=>audio.pause(),stop:()=>audio.pause(),
    previoustrack:()=>prev(true),nexttrack:()=>next(false),
    seekto:e=>{if(e&&isFinite(e.seekTime)){audio.currentTime=e.seekTime;syncPos(true);}},
    seekbackward:null,seekforward:null};
  for(const k in h){try{navigator.mediaSession.setActionHandler(k,h[k]);}catch(e){}}
}
const msMeta=(t,src,type)=>{
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Batuque',
      artwork:src?[96,192,256,384,512].map(z=>({src,sizes:z+'x'+z,type:type||'image/jpeg'})):[]});
  }catch(e){}
};
async function setSession(t){
  if(!('mediaSession'in navigator)||!t)return;
  const tok=++sesTok;let url=null;
  msHandlers();                                  /* botões ⏮ ⏭ ▶ ⏸ e barra de progresso ativos já */
  msMeta(t,artUrl||'');                          /* título/artista trocam logo, sem esperar pela imagem */
  navigator.mediaSession.playbackState=audio.paused?'paused':'playing';
  syncPos(true);
  try{url=await artFor(t);}catch(e){}
  if(tok!==sesTok)return;
  const fb=covURL(t);
  const src=url||fb;
  msMeta(t,src,url?'image/jpeg':(t.cover&&t.cover.type)||'image/jpeg');
  navigator.mediaSession.playbackState=audio.paused?'paused':'playing';
  syncPos(true);
}

/* ---------- Visualizador (corrente elétrica que reage à música) ---------- */
const vz=$('#viz'),VN=24;let vzLevels=new Array(VN).fill(0),vzRaf=0,vzData=null,vzT=0;
function vzSize(){
  const r=vz.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(r.width*d),h=Math.round(r.height*d);
  if(w&&(vz.width!==w||vz.height!==h)){vz.width=w;vz.height=h;}
}
function vzFrame(){
  vzRaf=0;
  if(!$('#full').classList.contains('show')||document.hidden)return;
  vzSize();
  const c=vz.getContext('2d'),W=vz.width,H=vz.height;if(!W)return;
  const playing=!audio.paused&&!audio.ended;
  if(playing&&!vzAn&&actx===null)initEQ();
  if(vzAn&&!vzData)vzData=new Uint8Array(vzAn.frequencyBinCount);
  let got=false;
  if(playing&&vzAn&&vzData){vzAn.getByteFrequencyData(vzData);got=vzData.some(v=>v>0);}
  vzT+=.09;
  const bins=vzData?Math.floor(vzData.length*.75):0;
  for(let i=0;i<VN;i++){
    let v=0;
    if(playing){
      if(got){
        const a=Math.floor(Math.pow(i/VN,1.6)*bins),b=Math.max(a+1,Math.floor(Math.pow((i+1)/VN,1.6)*bins));
        let m=0;for(let k=a;k<b;k++)m=Math.max(m,vzData[k]);
        v=Math.pow(m/255,1.25);
      }else v=.25+.2*Math.sin(vzT*1.7+i*.7)+.15*Math.sin(vzT*2.9+i*1.9);
    }
    const k=v>vzLevels[i]?.6:.14;
    vzLevels[i]+=(v-vzLevels[i])*k;
  }
  c.clearRect(0,0,W,H);
  /* corrente elétrica: linha fina em zigue-zague, com faíscas que crescem com a música */
  const col=getComputedStyle($('#full')).getPropertyValue('--yel').trim()||'#ffcb05',mid=H/2,d=W/312;
  const PN=VN*2;
  const pts=[];
  let tot=0;for(let i=0;i<VN;i++)tot+=vzLevels[i];
  const pw=Math.min(1,tot/VN*2.2);
  for(let j=0;j<=PN;j++){
    const x=j/PN,f=x*(VN-1),i0=Math.floor(f),i1=Math.min(VN-1,i0+1),lv=vzLevels[i0]+(vzLevels[i1]-vzLevels[i0])*(f-i0);
    const env=Math.sin(Math.PI*x)**.6;
    const amp=(.06+.94*Math.max(lv,pw*.35))*env*(H/2-3);
    const jit=(Math.random()*2-1)*amp*(j===0||j===PN?0:1);
    pts.push([x*W,mid+jit+Math.sin(vzT*3+j*.8)*amp*.12]);
  }
  const path=()=>{c.beginPath();pts.forEach((q,j)=>j?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));};
  c.lineJoin='round';c.lineCap='round';
  c.shadowColor=col;c.shadowBlur=14*d;
  c.strokeStyle=col;c.globalAlpha=.35+.4*pw;c.lineWidth=3.2*d;path();c.stroke();
  c.shadowBlur=6*d;c.globalAlpha=1;c.lineWidth=1.3*d;path();c.stroke();
  c.shadowBlur=0;c.strokeStyle='#fff';c.globalAlpha=.55+.4*pw;c.lineWidth=.6*d;path();c.stroke();
  c.globalAlpha=1;
  if(playing||vzLevels.some(l=>l>.02))vzRaf=requestAnimationFrame(vzFrame);
}
function vzKick(){if(!vzRaf&&$('#full').classList.contains('show'))vzRaf=requestAnimationFrame(vzFrame);}
audio.addEventListener('play',vzKick);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)vzKick();});

/* ---------- Retomar onde parou ---------- */
const RS_KEY='batuque_resume';
let rsLast=0,rsWait=false,rsDone=false;
function saveResume(force){
  if(rsWait)return;
  const now=Date.now();if(!force&&now-rsLast<4000)return;
  const t=cur();if(!t)return;rsLast=now;
  try{
    const d=audio.duration||0,c=audio.readyState<1?0:audio.currentTime||0;
    localStorage.setItem(RS_KEY,JSON.stringify({id:t.id,pos:(d&&c>d-3)?0:Math.floor(c*10)/10,q:queue.length<=3000?queue:[t.id],qi:queue.length<=3000?qi:0,ctx:ctxName}));
  }catch(e){}
}
function restoreResume(){
  if(rsDone||qi>=0)return;rsDone=true;
  let r=null;try{r=JSON.parse(localStorage.getItem(RS_KEY)||'null');}catch(e){}
  if(!r||!r.id||!byId(r.id))return;
  const q=(Array.isArray(r.q)?r.q:[r.id]).filter(id=>byId(id));
  const i=q.indexOf(r.id);if(i<0)return;
  queue=q;qi=i;ctxName=r.ctx||'A tocar';qctx=null;
  const t=cur();if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(t.blob);audio.src=curUrl;audio.pause();
  const pos=+r.pos||0;
  if(pos>1){
    rsWait=true;
    audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=Math.min(pos,Math.max(0,(audio.duration||pos)-1));}catch(e){}rsWait=false;},{once:true});
    setTimeout(()=>{rsWait=false;},4000);
  }
  setSession(t);updateUI();
}

/* ---------- Temporizador de sono ---------- */
let sleepMode=null,sleepEnd=0,sleepT=0;
function sleepClear(){sleepMode=null;sleepEnd=0;clearInterval(sleepT);sleepT=0;}
function sleepLeft(){return Math.max(0,Math.ceil((sleepEnd-Date.now())/1000));}
function sleepLabel(){
  if(sleepMode==='track')return 'Temporizador de sono · no fim da música';
  if(sleepMode==='time')return 'Temporizador de sono · '+fmt(sleepLeft())+' restantes';
  return 'Temporizador de sono';
}
function sleepFade(){
  const v0=audio.volume;let n=12;
  const f=setInterval(()=>{
    n--;audio.volume=Math.max(0,v0*n/12);
    if(n<=0){clearInterval(f);audio.pause();audio.volume=vol;toast('Temporizador de sono: música parada',4000);}
  },250);
}
function sleepSet(min){
  sleepClear();
  if(min==='track'){sleepMode='track';toast('A música pára no fim desta faixa',3000);return;}
  sleepMode='time';sleepEnd=Date.now()+min*60000;
  sleepT=setInterval(()=>{
    if(sleepLeft()>0)return;
    sleepClear();
    if(!audio.paused)sleepFade();
  },1000);
  toast('A música pára dentro de '+min+' min',3000);
}
function sleepMenu(){
  const it=[15,30,45,60,90].map(m=>({label:m+' minutos',fn:()=>sleepSet(m)}));
  it.push({label:'No fim da música',fn:()=>sleepSet('track')});
  if(sleepMode)it.push({label:'Desligar temporizador',danger:true,fn:()=>{sleepClear();toast('Temporizador desligado',2000);}});
  sheet(sleepLabel(),it);
}

/* ---------- Cópia de segurança ---------- */
const trackKey=t=>(t.blob?t.blob.size:0)+'|'+(t.fname||(t.title+'|'+t.artist));
const BK_KEYS=['batuque_cfg','batuque_view','batuque_mini','batuque_vol','batuque_eq','batuque_stats','batuque_fgenre','batuque_fs'];
async function backupExport(){
  const keyById=new Map(tracks.map(t=>[t.id,trackKey(t)]));
  const data={app:'Batuque',v:1,date:new Date().toISOString(),
    tracks:tracks.map(t=>({k:trackKey(t),title:t.title,artist:t.artist,genre:t.genre||'',folder:t.folder||'',fav:!!t.fav,added:t.added})),
    lists:lists.map(l=>({name:l.name,keys:l.ids.map(i=>keyById.get(i)).filter(Boolean)})),
    ls:{}};
  BK_KEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)data.ls[k]=v;}catch(e){}});
  /* ficheiro .batuque (comprimido): descarrega-se em vez de abrir como texto no navegador */
  let part=new Blob([JSON.stringify(data)]);
  try{if(window.CompressionStream)part=await new Response(part.stream().pipeThrough(new CompressionStream('gzip'))).blob();}catch(e){}
  const blob=new Blob([part],{type:'application/octet-stream'});
  const a=document.createElement('a'),u=URL.createObjectURL(blob);
  a.href=u;a.download='Batuque-copia-'+new Date().toISOString().slice(0,10)+'.batuque';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
  const nf=data.tracks.filter(t=>t.fav).length;
  toast('Cópia guardada: '+nf+(nf===1?' favorito':' favoritos')+' · '+data.lists.length+(data.lists.length===1?' lista':' listas')+' · estatísticas e definições',5000);
}
async function backupImport(file){
  let d;
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    let txt;
    if(buf[0]===0x1f&&buf[1]===0x8b){txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
    else txt=new TextDecoder().decode(buf);
    d=JSON.parse(txt);
  }catch(e){}
  if(!d||d.app!=='Batuque'||!Array.isArray(d.tracks)){toast('Ficheiro inválido: não é uma cópia do Batuque',4000);return;}
  const nf=d.tracks.filter(t=>t.fav).length,nl=(d.lists||[]).length;
  if(!await dlg({title:'Restaurar cópia',msg:'Restaurar a cópia de '+(d.date?d.date.slice(0,10):'data desconhecida')+'?\nContém '+nf+(nf===1?' favorito':' favoritos')+' e '+nl+(nl===1?' lista':' listas')+'.\nFavoritos, listas, estatísticas e definições são combinados com os atuais.\nAs músicas em si não fazem parte da cópia: têm de estar na biblioteca.',ok:'Restaurar',cancel:'Cancelar',icon:'refresh'}))return;
  const byKey=new Map(tracks.map(t=>[trackKey(t),t]));
  let found=0,miss=0;
  for(const b of d.tracks){
    const t=byKey.get(b.k);if(!t){miss++;continue;}
    found++;let ch=false;
    if(b.fav&&!t.fav){t.fav=true;ch=true;}
    if(b.title&&b.title!==t.title){t.title=b.title;ch=true;}
    if(b.artist&&b.artist!==t.artist){t.artist=b.artist;ch=true;}
    if(b.genre&&b.genre!==t.genre){t.genre=b.genre;t.genreTried=true;ch=true;}
    if(ch)await tx('tracks','readwrite',s=>s.put(t));
  }
  for(const b of (d.lists||[])){
    const ids=(b.keys||[]).map(k=>byKey.get(k)).filter(Boolean).map(t=>t.id);
    let l=lists.find(x=>x.name===b.name);
    if(!l){l={id:crypto.randomUUID(),name:b.name,ids:[]};ids.forEach(i=>l.ids.push(i));}
    else ids.forEach(i=>{if(!l.ids.includes(i))l.ids.push(i);});
    await tx('lists','readwrite',s=>s.put(l));
  }
  try{Object.entries(d.ls||{}).forEach(([k,v])=>{if(BK_KEYS.includes(k)&&typeof v==='string')localStorage.setItem(k,v);});}catch(e){}
  toast('Restaurado: '+found+' músicas encontradas'+(miss?' · '+miss+' não estão na biblioteca':''),3500);
  setTimeout(()=>location.reload(),1800);
}

/* ---------- Equalizador (Web Audio) ---------- */
const EQF=[60,230,910,3600,14000],EQL=['60 Hz','230 Hz','910 Hz','3,6 kHz','14 kHz'];
const EQP={'Normal':[0,0,0,0,0],'Graves':[6,4,0,-1,-2],'Agudos':[-2,-1,0,4,6],'Voz':[-3,-1,4,3,-1],'Rock':[5,3,-2,3,5],'Pop':[-1,2,4,2,-1],'Eletrónica':[6,4,0,2,5]};
let eqG=[0,0,0,0,0],actx=null,eqNodes=[],vzAn=null;
try{const s=JSON.parse(localStorage.getItem('batuque_eq'));if(Array.isArray(s)&&s.length===5)eqG=s.map(Number);}catch(e){}
const fmtdb=v=>(v>0?'+':'')+v+' dB';
function initEQ(){
  if(actx)return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    actx=new AC();
    let prev=actx.createMediaElementSource(audio);
    eqNodes=EQF.map((f,i)=>{
      const n=actx.createBiquadFilter();
      n.type=i===0?'lowshelf':i===EQF.length-1?'highshelf':'peaking';
      n.frequency.value=f;if(n.type==='peaking')n.Q.value=1;
      n.gain.value=eqG[i];prev.connect(n);prev=n;return n;
    });
    vzAn=actx.createAnalyser();vzAn.fftSize=256;vzAn.smoothingTimeConstant=.55;
    prev.connect(vzAn);vzAn.connect(actx.destination);
    return true;
  }catch(e){actx=null;return false;}
}
function applyEQ(){
  eqNodes.forEach((n,i)=>{n.gain.value=eqG[i];});
  try{localStorage.setItem('batuque_eq',JSON.stringify(eqG));}catch(e){}
}
audio.addEventListener('play',()=>{if(actx&&actx.state==='suspended')actx.resume();});
function openEQ(){
  if(!initEQ()){toast('Equalizador não suportado neste navegador');return;}
  if(actx.state==='suspended')actx.resume();
  const b=$('#sbox');
  b.innerHTML='<h3>Equalizador</h3><div class="chips">'+Object.keys(EQP).map(k=>`<button class="chip" data-p="${k}">${k}</button>`).join('')+'</div>'
    +EQF.map((f,i)=>`<div class="eqrow"><span>${EQL[i]}</span><input type="range" min="-12" max="12" step="1" value="${eqG[i]}" data-b="${i}"><output>${fmtdb(eqG[i])}</output></div>`).join('');
  const sync=()=>{
    b.querySelectorAll('input[data-b]').forEach((el,i)=>{el.value=eqG[i];el.nextElementSibling.textContent=fmtdb(eqG[i]);});
    b.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',EQP[c.dataset.p].every((v,i)=>v===eqG[i])));
  };
  b.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;eqG=EQP[c.dataset.p].slice();applyEQ();sync();};
  b.oninput=e=>{const el=e.target;if(el.dataset.b===undefined)return;eqG[+el.dataset.b]=+el.value;applyEQ();sync();};
  sync();
  $('#sheet').classList.add('show');
}

async function shareTrack(t){
  if(!t)return;
  const type=t.blob.type||'audio/mpeg';
  const name=t.blob.name||(t.artist+' - '+t.title+'.'+(type.split('/')[1]||'mp3').replace('mpeg','mp3'));
  const f=t.blob instanceof File?t.blob:new File([t.blob],name,{type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t.title,text:t.title+' — '+t.artist});return;}
    if(navigator.share){await navigator.share({title:t.title,text:t.title+' — '+t.artist});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(f);a.download=f.name||name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  toast('A guardar o ficheiro…');
}
/* Um site não pode mudar o toque do sistema: guarda o ficheiro e explica como o escolher. */
function ringtoneTrack(t){
  if(!t)return;

  const ext=(t.blob.name&&t.blob.name.includes('.'))?t.blob.name.split('.').pop():(type.split('/')[1]||'mp3').replace('mpeg','mp3');
  const name=(t.artist+' - '+t.title).replace(/[\\/:*?"<>|]/g,'')+'.'+ext;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(t.blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  toast('Ficheiro guardado em Transferências. Em Definições › Som › Toque, escolhe-o na lista.',7000);

let miniPos=null;

let miniC={c:false,side:'l'};

const saveMiniC=()=>{try{localStorage.setItem('batuque_minic',JSON.stringify(miniC));}catch(e){}};
function miniSide(m){return (m.offsetLeft+m.offsetWidth/2>innerWidth/2)?'r':'l';}
function miniCollapse(){
  const m=$('#mini');
  if(miniC.c){
    /* expandir: fica encostado ao mesmo lado */
    miniC.c=false;
    miniPos={x:miniC.side==='r'?1:0,y:miniPos&&isFinite(miniPos.y)?miniPos.y:m.offsetTop/((innerHeight-m.offsetHeight)||1)};
    try{localStorage.setItem('batuque_mini',JSON.stringify(miniPos));}catch(e){}
  }else{
    miniC.side=miniSide(m);miniC.c=true;
    miniPos={x:miniPos&&isFinite(miniPos.x)?miniPos.x:0,y:m.offsetTop/((innerHeight-m.offsetHeight)||1)};
    try{localStorage.setItem('batuque_mini',JSON.stringify(miniPos));}catch(e){}
  }
  saveMiniC();placeMini();

function placeMini(){
  const m=$('#mini');
  if(!m.classList.contains('show'))return;
  m.classList.toggle('mc',miniC.c);
  m.classList.toggle('sl',miniC.c&&miniC.side==='l');
  m.classList.toggle('sr',miniC.c&&miniC.side==='r');
  const w=m.offsetWidth,h=m.offsetHeight,W=innerWidth,H=innerHeight;
  let x=8,y=H-h-88;
  if(miniPos&&isFinite(miniPos.x)&&isFinite(miniPos.y)){x=miniPos.x*(W-w);y=miniPos.y*(H-h);}
  else if(miniC.c)y=H-h-88;
  if(miniC.c)x=miniC.side==='r'?W-w:0;
  m.style.left=Math.min(Math.max(0,x),Math.max(0,W-w))+'px';
  m.style.top=Math.min(Math.max(0,y),Math.max(0,H-h))+'px';
  /* a seta aponta para o lado onde o mini-player encolhe; encolhido, aponta para fora (expandir) */
  const arr=$('#marr');
  if(arr){
    const left=miniC.c?miniC.side==='r':miniSide(m)==='l';
    arr.firstElementChild.style.transform=left?'rotate(180deg)':'';
  }
}

(function(){
  const m=$('#mini');
  let pid=null,sx=0,sy=0,ox=0,oy=0,moved=false;
  m.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=m.offsetLeft;oy=m.offsetTop;moved=false;
    try{m.setPointerCapture(pid);}catch(x){}
  });
  m.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;m.classList.add('drag');
    const w=m.offsetWidth,h=m.offsetHeight;
    m.style.left=Math.min(Math.max(0,ox+dx),Math.max(0,innerWidth-w))+'px';
    m.style.top=Math.min(Math.max(0,oy+dy),Math.max(0,innerHeight-h))+'px';
  });
  const end=e=>{
    if(e.pointerId!==pid)return;
    pid=null;m.classList.remove('drag');
    if(moved){
      const w=m.offsetWidth,h=m.offsetHeight;
      miniPos={x:m.offsetLeft/((innerWidth-w)||1),y:m.offsetTop/((innerHeight-h)||1)};
      if(miniC.c){miniC.side=miniSide(m);saveMiniC();}
      try{localStorage.setItem('batuque_mini',JSON.stringify(miniPos));}catch(x){}
      placeMini();
    }else if(e.type==='pointerup')openFull();
  };
  m.addEventListener('pointerup',end);
  m.addEventListener('pointercancel',end);
})();

  const t=cur(),playing=!audio.paused&&!audio.ended&&!!t;

const knownGenre=k=>{
  const n=String(k||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!n)return'';
  const hay=' '+n.replace(/[^a-z0-9&]+/g,' ').trim()+' ';
  for(const g of GENRES.concat(['Afrobeat','Samba','Sertanejo','Funaná','Morna','Coladeira','Kilapanga','Rebita','Louvor'])){
    const gn=g.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(hay.includes(' '+gn+' '))return g==='Louvor'?'Gospel':g;
  }
  return'';
};

function fmtT(sec){
  sec=Math.round(sec||0);
  if(sec<60)return sec+' s';
  const m=Math.floor(sec/60);
  if(m<60)return m+' min';
  const h=Math.floor(m/60);return h+' h'+(m%60?' '+(m%60)+' min':'');
}
const pct=v=>Math.round(v*100)+'%';
const PAL=['var(--yel)','var(--red)','#2f9e6b','#3b82c4','#a855c7'];
function donutSVG(sl,center,sub){
  const R=42,C=2*Math.PI*R;let off=0;
  let x=`<svg viewBox="0 0 100 100" role="img"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--card2)" stroke-width="14"/>`;
  sl.forEach(z=>{const len=Math.max(0,z.v)*C;if(len>.4)x+=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${z.c}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`;off+=len;});
  return x+`<text x="50" y="${sub?48:55}" text-anchor="middle" font-size="${center.length>3?14:17}" font-weight="800" fill="var(--tx)">${center}</text>${sub?`<text x="50" y="62" text-anchor="middle" font-size="8" fill="var(--mut)">${sub}</text>`:''}</svg>`;
}
const ringSVG=(v,c)=>donutSVG([{v:Math.min(1,v),c:c||'var(--yel)'}],pct(v));
function statsData(){
  const live=new Map(tracks.map(t=>[t.id,t]));
  const rows=[];let total=0;
  live.forEach((t,id)=>{const p=ST.p[id]||0;if(p>0){rows.push({t,p,s:ST.s[id]||0});total+=p;}});
  rows.sort((a,b)=>b.p-a.p||b.s-a.s);
  const fm=new Map(),gm=new Map();
  rows.forEach(r=>{
    const fk=r.t.folder||'',f=fm.get(fk)||{k:fk,p:0,s:0};f.p+=r.p;f.s+=r.s;fm.set(fk,f);
    const g=trackGenre(r.t);if(g){const e=gm.get(g)||{g,p:0,s:0};e.p+=r.p;e.s+=r.s;gm.set(g,e);}
  });
  const folders=[...fm.values()].sort((a,b)=>b.p-a.p||b.s-a.s);
  const genres=[...gm.values()].sort((a,b)=>b.p-a.p||b.s-a.s);
  return {rows,total,folders,genres,gTotal:genres.reduce((a,b)=>a+b.p,0)};
}
function statsHTML(){
  const d=statsData(),top=d.rows.slice(0,5),today=ST.days[dayKey()]||{open:0,listen:0};
  const since=new Date(ST.since||Date.now()).toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'});
  let h=`<div class="head2"><h2>Estatísticas</h2><button class="ib" id="stmore" aria-label="Mais">${ic('more')}</button></div>`;
  /* tempo */
  h+=`<div class="st-grid">
    <div class="st-card"><small>App aberta (total)</small><b>${fmtT(ST.open)}</b><small>Hoje ${fmtT(today.open)} · sessão ${fmtT(stSess)}</small></div>
    <div class="st-card"><small>A ouvir música</small><b>${fmtT(ST.listen)}</b><small>Hoje ${fmtT(today.listen)}</small></div>
    <div class="st-card"><small>Reproduções</small><b>${d.total}</b><small>${d.rows.length} ${d.rows.length===1?'música diferente':'músicas diferentes'}</small></div>
    <div class="st-card"><small>Aberturas da app</small><b>${ST.sess||1}</b><small>desde ${since}</small></div></div>`;
  if(!d.total){
    h+=`<div class="st-sec">Mais ouvidas</div><div class="st-hint">Ainda não há reproduções.<br>Ouve uma música durante 30 segundos ou mais para começar a contar.</div>`;
  }else{
    /* top 5 músicas */
    h+=`<div class="st-sec">Últimas 5 mais ouvidas</div>`;
    const ids=top.map(r=>r.t.id).join(',');
    top.forEach((r,i)=>{
      const v=r.p/d.total;
      h+=`<div class="st-row" data-stid="${r.t.id}" data-q="${ids}"><span class="st-n">${i+1}</span>
      <div class="cov" style="${cover(r.t)}">${covInner(r.t)}</div>
      <div class="meta"><div class="t">${esc(r.t.title)}</div><div class="a">${esc(r.t.artist)} · ${r.p}×</div><div class="st-bar"><i style="width:${Math.max(3,v*100)}%;background:${PAL[i]}"></i></div></div>
      <div class="st-pct">${pct(v)}<small>${fmtT(r.s)}</small></div></div>`;
    });
    /* pastas */
    h+=`<div class="st-sec">Pastas mais tocadas</div>`;
    d.folders.slice(0,5).forEach((f,i)=>{
      const v=f.p/d.total;
      h+=`<div class="st-row" data-folder="${encodeURIComponent(f.k)}"><span class="st-n">${i+1}</span>
      <div class="cov" style="background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 45%,#000))">${ic('folder',22)}</div>
      <div class="meta"><div class="t">${esc(folderName(f.k))}</div><div class="a">${f.p} ${f.p>1?'reproduções':'reprodução'} · ${fmtT(f.s)}</div><div class="st-bar"><i style="width:${Math.max(3,v*100)}%"></i></div></div>
      <div class="st-pct">${pct(v)}</div></div>`;
    });
    /* gráficos */
    const top5p=top.reduce((a,r)=>a+r.p,0),rest=d.total-top5p;
    const sl=top.map((r,i)=>({v:r.p/d.total,c:PAL[i]}));if(rest>0)sl.push({v:rest/d.total,c:'#8a8a95'});
    h+=`<div class="st-sec">Gráfico percentual</div><div class="st-box"><div class="st-donut">${donutSVG(sl,pct(top5p/d.total),'no top 5')}
      <div class="st-leg">${top.map((r,i)=>`<div><i style="background:${PAL[i]}"></i><span>${esc(r.t.title)}</span><b>${pct(r.p/d.total)}</b></div>`).join('')}${rest>0?`<div><i style="background:#8a8a95"></i><span>Outras</span><b>${pct(rest/d.total)}</b></div>`:''}</div></div></div>`;
  }
  const f0=d.folders[0],ls=ST.open>0?ST.listen/ST.open:0;
  h+=`<div class="st-box"><div class="st-rings">
    <div>${ringSVG(d.total?d.rows.slice(0,5).reduce((a,r)=>a+r.p,0)/d.total:0,PAL[0])}<b>Top 5 músicas</b><small>das reproduções</small></div>
    <div>${ringSVG(f0&&d.total?f0.p/d.total:0,PAL[1])}<b>${f0?esc(folderName(f0.k)):'Pasta'}</b><small>pasta mais usada</small></div>
    <div>${ringSVG(ls,PAL[2])}<b>${fmtT(ST.listen)} / ${fmtT(ST.open)}</b><small>a ouvir · app aberta</small></div></div></div>`;
  /* 7 dias */
  const days=[];for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);days.push({k:dayKey(dt),w:'DSTQQSS'[dt.getDay()],i});}
  const mx=Math.max(60,...days.map(x=>(ST.days[x.k]||{}).open||0));
  h+=`<div class="st-box"><small style="color:var(--mut)">Tempo com a app aberta · últimos 7 dias</small><div class="st-days">${days.map(x=>{const o=(ST.days[x.k]||{}).open||0;return `<div class="${x.i===0?'hoje':''}" title="${fmtT(o)}"><i style="height:${Math.max(4,o/mx*70)}px;${x.i===0?'':'opacity:.6'}"></i>${x.w}</div>`;}).join('')}</div></div>`;
  /* prémio */
  h+=`<div class="st-sec">Prémio · estilo mais ouvido</div>`;
  if(d.genres.length){
    const g=d.genres[0],med=['🥇','🥈','🥉'];
    h+=`<div class="prize"><div class="tro">${ic('trophy')}</div><h3>Campeão do estilo</h3><div class="gn">${esc(g.g)}</div>
      <p>${pct(g.p/d.gTotal)} das tuas reproduções · ${fmtT(g.s)} a ouvir</p>
      <div class="podium">${d.genres.slice(0,3).map((x,i)=>`<div><span class="md">${med[i]}</span><span>${esc(x.g)}</span><b>${pct(x.p/d.gTotal)}</b></div>`).join('')}</div></div>`;
    h+=`<button class="st-btn" id="stgenre">Definir estilo das pastas</button>`;
  }else{
    h+=`<div class="st-hint">${d.total?'Ainda não sei o estilo das tuas músicas.<br>Define o estilo para eu atribuir o prémio.':'O prémio aparece depois de ouvires algumas músicas.'}
      <br><br>Dica: na biblioteca, mantém premida uma música, marca as que quiseres e toca em <b>Estilo</b>.</div>
      <button class="st-btn" id="stgenre">Definir estilo das pastas</button>`;
  }
  return h;
}
function statsMenu(){
  sheet('Estatísticas',[{label:'Repor estatísticas',danger:true,fn:async()=>{
    if(!await askOk('Repor estatísticas','Apagar todas as estatísticas (reproduções, tempos e prémios)?\nEsta ação não pode ser desfeita.','Repor',true))return;
    ST={p:{},s:{},l:{},open:0,listen:0,sess:1,since:Date.now(),days:{}};stSess=0;stSave();render();toast('Estatísticas repostas');
  }}]);
}
function genreSheet(title,cb){
  const it=GENRES.map(g=>({label:g,fn:()=>cb(g)}));
  it.push({label:'Outro…',fn:async()=>{const v=normGenre(await askText('Novo estilo','Escreve o nome do estilo de música.','','Ex.: Kizomba','Definir')||'');if(v)cb(v);}});
  it.push({label:'Sem estilo',fn:()=>cb('')});
  sheet(title,it);
}
async function setGenreSel(){
  const ids=[...sel].filter(byId);if(!ids.length)return;
  genreSheet('Estilo de '+ids.length+(ids.length>1?' músicas':' música'),async g=>{
    await tx('tracks','readwrite',s=>{ids.forEach(id=>{const t=byId(id);t.genre=g;t.genreTried=true;s.put(t);});});
    toast(g?'Estilo definido: '+g:'Estilo removido');endSel();
  });
}
function folderStyleMenu(){
  const ks=[...new Set(tracks.map(t=>t.folder||''))].sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b,'pt'));
  sheet('Estilo das pastas',ks.map(k=>({label:folderName(k)+' · '+(folderGenre(k)||'sem estilo'),fn:()=>genreSheet('Estilo de "'+folderName(k)+'"',g=>{
    if(g)FG[k]=g;else delete FG[k];
    try{localStorage.setItem(FG_KEY,JSON.stringify(FG));}catch(e){}
    render();toast(g?'Pasta definida como '+g:'Estilo da pasta removido');
  })})));
}

/* ---------- Volume (ecrã completo) ---------- */
const VOL_KEY='batuque_vol';
let vol=1,volBefore=1;
try{const v=parseFloat(localStorage.getItem(VOL_KEY));if(v>=0&&v<=1)vol=v;}catch(e){}
function volUI(){
  const pc=Math.round(vol*100);
  $('#vfill').style.width=pc+'%';$('#vpct').textContent=pc+'%';
  $('#vico').innerHTML=ic(vol===0?'mute':'vol');
}
function setVol(v,save){
  vol=Math.max(0,Math.min(1,Math.round(v*100)/100));
  audio.volume=vol;volUI();
  if(save){try{localStorage.setItem(VOL_KEY,String(vol));}catch(e){}}
}
(function(){
  const box=$('#vol'),tr=$('#vtrack');let x0=0,v0=0,drag=false;
  box.addEventListener('pointerdown',e=>{
    if(e.target.closest('#vico'))return;
    drag=true;x0=e.clientX;v0=vol;box.classList.add('drag');
    try{box.setPointerCapture(e.pointerId);}catch(x){}
  });
  box.addEventListener('pointermove',e=>{
    if(!drag)return;
    setVol(v0+(e.clientX-x0)/Math.max(120,tr.clientWidth));
  });
  const end=()=>{if(!drag)return;drag=false;box.classList.remove('drag');setVol(vol,true);};
  ['pointerup','pointercancel'].forEach(n=>box.addEventListener(n,end));
  $('#vico').onclick=()=>{if(vol>0){volBefore=vol;setVol(0,true);}else setVol(volBefore||1,true);};
  setVol(vol,false);
})();

/* ---------- PWA / offline ---------- */
(function(){
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  const first=!navigator.serviceWorker.controller;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const w=reg.installing||reg.waiting;
      const done=()=>{if(first)toast('Pronto para funcionar sem internet',3200);};
      if(w){w.addEventListener('statechange',()=>{if(w.state==='activated')done();});}
      else if(reg.active&&first)done();
    }).catch(()=>{});
  });
  const off=()=>toast('Sem internet · a app continua a funcionar',2500);
  window.addEventListener('offline',off);
})();

load();
</script>
